<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>タカバシラ 経営ダッシュボード</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* ───────── 色（タカバシラ トンマナ：主役ゴールド／文字インク／白） ───────── */
:root{
  --gold:#F5CC52; --gold-d:#C9971C; --gold-l:#FBF1D2; --gold-xl:#FDF8E8;
  --ink:#1A140A; --ink-2:#4A4336; --mut:#7A7264; --mut-2:#A8A193;
  --blue:#3780BB; --deep:#10539C; --blue-l:#E8F0F8; --mint:#CEE8D9; --green:#2E7D4F; --green-l:#E9F3EC;
  --red:#B8412F; --red-l:#F9ECE9; --amber:#B8860B; --amber-l:#FBF3DC;
  --bg:#F7F5EF; --card:#FFFFFF; --soft:#FAF8F3; --line:#E6E1D6; --line-2:#F0ECE3;
  --sh:0 1px 2px rgba(26,20,10,.05),0 4px 14px rgba(26,20,10,.04);
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Meiryo",sans-serif;
  background:var(--bg);color:var(--ink);font-size:14px;line-height:1.65;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:#D8D2C4;border-radius:3px}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ───────── 上部 ───────── */
.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.top-in{max-width:1200px;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:18px;height:58px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mark{width:26px;height:26px;border-radius:8px;background:var(--gold);position:relative;flex-shrink:0}
.brand .mark::after{content:"";position:absolute;inset:7px;border-radius:4px;background:var(--ink);opacity:.9;
  clip-path:polygon(50% 0,100% 60%,70% 60%,50% 100%,30% 60%,0 60%)}
.brand b{font-size:15px;font-weight:800;letter-spacing:.01em;white-space:nowrap}
.brand small{display:block;font-size:11px;color:var(--mut);font-weight:600;margin-top:-2px;white-space:nowrap}
.fy{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:3px 4px;background:var(--soft)}
.fy button{width:26px;height:26px;border-radius:50%;font-size:11px;color:var(--mut)}
.fy button:hover{background:var(--card);color:var(--ink)}
.fy button:disabled{opacity:.3;cursor:default}
.fy span{font-size:13px;font-weight:800;min-width:70px;text-align:center}
.top .sp{flex:1}
.sync{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mut);white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block}
.sync i.busy{background:var(--gold-d);animation:blink 1.2s infinite}
.sync i.ng{background:var(--red)}
.ver{font-size:10px;color:var(--mut-2);font-weight:700}

/* ボタン */
.btn{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:12.5px;padding:8px 14px;border-radius:9px;
  border:1px solid var(--line);background:var(--card);color:var(--ink-2);white-space:nowrap;line-height:1.2}
.btn:hover{border-color:#CFC9BA;background:var(--soft)}
.btn.pri{background:var(--gold);border-color:#E2B93C;color:var(--ink)}
.btn.pri:hover{background:#F0C43F}
.btn.ink{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.ink:hover{background:#2E271A}
.btn.danger{color:var(--red)}
.btn.sm{font-size:11.5px;padding:6px 10px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{border-color:transparent;background:transparent;color:var(--mut)}
.btn.ghost:hover{background:var(--soft);color:var(--ink)}

/* 月ナビ */
.months{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:58px;z-index:39}
.months-in{max-width:1200px;margin:0 auto;padding:0 24px;display:flex;align-items:stretch;overflow-x:auto;scrollbar-width:none}
.months-in::-webkit-scrollbar{display:none}
.mtab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:8px 13px 7px;
  border-bottom:3px solid transparent;color:var(--mut);white-space:nowrap;min-width:54px;flex-shrink:0}
.mtab .n{font-size:13px;font-weight:700;line-height:1.2}
.mtab .v{font-size:10px;font-weight:700;color:var(--mut-2);line-height:1.2;font-variant-numeric:tabular-nums}
.mtab .v.pos{color:var(--green)} .mtab .v.neg{color:var(--red)}
.mtab.has{color:var(--ink-2)}
.mtab.on{color:var(--ink);border-bottom-color:var(--gold)}
.mtab.all{padding-left:0;padding-right:18px;margin-right:6px;border-right:1px solid var(--line);border-bottom-color:transparent}
.mtab.all.on{border-bottom-color:var(--gold)}
.mtab.all .n{font-size:13.5px}
.mtab .dots{display:flex;gap:3px;height:4px;margin-top:2px}
.mtab .dots i{width:4px;height:4px;border-radius:50%;background:var(--line)}
.mtab .dots i.k{background:var(--blue)} .mtab .dots i.r{background:var(--green)}

/* セクションのピル */
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 18px}
.pill{font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--mut)}
.pill:hover{color:var(--ink);border-color:#CFC9BA}
.pill.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* 月ページのタブ（財務／スポーツクラブ／コインランドリー／経営報告書） */
.seg{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:16px;width:fit-content;box-shadow:var(--sh)}
.seg button{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:9px;font-weight:700;font-size:13px;color:var(--mut);white-space:nowrap}
.seg button:hover{color:var(--ink);background:var(--soft)}
.seg button.on{background:var(--ink);color:#fff}
.seg button i{width:6px;height:6px;border-radius:50%;background:transparent;display:inline-block}
.seg button i.has{background:var(--gold)}
.seg button.on i.has{background:var(--gold)}
.row.has-sub{cursor:pointer} .row.has-sub:hover{background:var(--soft)}
.row .k{display:flex;align-items:center;gap:6px}
.tg{width:22px;height:22px;border-radius:50%;font-size:12px;color:var(--deep);background:var(--blue-l);flex-shrink:0;display:inline-flex;align-items:center;justify-content:center}
.tg:hover{background:#D6E4F3} .tg.on{background:var(--deep);color:#fff}
.rows.sub{margin:0 0 4px 12px;border-left:2px solid var(--line);padding-left:10px}
.rows.sub .row{font-size:12.5px;padding:6px 0} .rows.sub .row .k{color:var(--mut)}
.row.note-row{padding:6px 0}
.rows-dd{margin:2px 0}
.rows-dd summary{cursor:pointer;font-size:12px;color:var(--deep);font-weight:700;list-style:none;padding:7px 0 7px 6px;border-bottom:1px solid var(--line-2)}
.rows-dd summary::before{content:"▸ "} .rows-dd[open] summary::before{content:"▾ "}

/* 用語（押すと説明）・前月比・12か月表・見方 */
.term{border-bottom:1px dotted var(--mut-2);cursor:help}
.d{display:inline-block;font-size:11px;font-weight:700;margin-top:3px;white-space:nowrap}
.d.up{color:var(--green)} .d.down{color:var(--red)} .d.flat{color:var(--mut)}
.kf .d{display:block}
table.yr td:first-child{white-space:nowrap;font-weight:600}
table.yr td.num{font-weight:600}
table.yr td.num.pos{color:var(--green);background:var(--green-l)} table.yr td.num.neg{color:var(--red);background:var(--red-l)}
.gl-g{margin-bottom:14px} .gl-t{font-size:12px;font-weight:800;color:var(--mut);margin-bottom:6px;letter-spacing:.03em}
.gl-r{display:grid;grid-template-columns:120px 1fr;gap:8px;padding:7px 0;border-bottom:1px solid var(--line-2);font-size:12.5px;line-height:1.6}
.gl-r b{color:var(--ink)} .gl-r span{color:var(--ink-2)}
.print-head{display:none}

/* チュートリアル */
.tour-shade{position:fixed;inset:0;z-index:70}
.tour-hi{position:fixed;z-index:71;border-radius:12px;box-shadow:0 0 0 9999px rgba(26,20,10,.55),0 0 0 3px var(--gold);pointer-events:none;transition:all .25s ease}
.tour-pop{position:fixed;z-index:72;background:var(--card);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.25);padding:14px 16px 12px;width:360px;max-width:calc(100vw - 16px)}
.tp-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.tp-h b{font-size:14px;font-weight:800;flex:1}
.tp-n{font-size:10.5px;font-weight:800;color:#7A5A0A;background:var(--gold-l);padding:2px 8px;border-radius:999px}
.tp-h .x{width:26px;height:26px;border-radius:50%;color:var(--mut);font-size:14px}
.tp-h .x:hover{background:var(--soft);color:var(--ink)}
.tp-x{font-size:13px;line-height:1.75;color:var(--ink-2)}
.tp-f{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:8px}
.tp-dots{display:flex;gap:4px} .tp-dots i{width:6px;height:6px;border-radius:50%;background:var(--line);display:inline-block}
.tp-dots i.on{background:var(--gold-d)} .tp-dots i.done{background:var(--gold)}
.tp-btns{display:flex;gap:6px}
body.touring{overflow-x:hidden} body.touring .toast{display:none}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:65;background:var(--ink);color:#fff;border-radius:999px;padding:8px 8px 8px 18px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.25);white-space:nowrap;max-width:calc(100vw - 24px)}
.toast .btn.ghost{color:#D8D2C4} .toast .btn.ghost:hover{background:rgba(255,255,255,.1);color:#fff}
.gl-start{background:var(--gold-xl);border:1px solid #EED9A0;border-radius:12px;padding:12px 14px;margin-bottom:14px}
.gl-start b{font-size:13px}
@media(max-width:560px){.toast{white-space:normal;border-radius:14px;flex-wrap:wrap;justify-content:center;padding:10px 12px;text-align:center}}

/* ログイン */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-box{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);padding:28px 26px;width:100%;max-width:380px}
.login-box .brand b{font-size:17px} .login-box .brand small{font-size:12px}
.login-box input{padding:11px 12px;font-size:15px}

/* ───────── 本文 ───────── */
main{max-width:1200px;margin:0 auto;padding:22px 24px 90px}
.sec{margin-bottom:26px;scroll-margin-top:118px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin:0 0 10px;padding:0 2px}
.sec-h h2{font-size:15px;font-weight:800;letter-spacing:.01em}
.sec-h .sub{font-size:12px;color:var(--mut)}
.sec-h .r{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:1fr 2fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px 18px;min-width:0}
.card.flush{padding:0;overflow:hidden}
.card>h3,.ch{font-size:12.5px;font-weight:800;color:var(--ink-2);letter-spacing:.03em;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.ch .r{margin-left:auto;display:flex;gap:6px;align-items:center;font-weight:600;color:var(--mut);font-size:11.5px}
.card.flush>h3,.card.flush .ch{padding:12px 18px;border-bottom:1px solid var(--line-2);margin:0}

/* 数字タイル */
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px 12px;min-width:0;position:relative}
.tile .l{font-size:11px;font-weight:700;color:var(--mut);letter-spacing:.02em}
.tile .n{font-size:26px;font-weight:800;line-height:1.15;margin-top:4px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .n small{font-size:12px;font-weight:700;color:var(--mut);margin-left:2px;letter-spacing:0}
.tile .s{font-size:11px;color:var(--mut);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.hero .n{font-size:34px}
.tile.pos .n{color:var(--green)} .tile.neg .n{color:var(--red)} .tile.dim .n{color:var(--mut-2)}
.tile.warn{border-color:#E8C79A;background:var(--amber-l)} .tile.warn .n{color:var(--amber)}
.tile.gold{background:var(--gold-xl);border-color:#EED9A0}
.tile .bar{height:5px;border-radius:3px;background:var(--line-2);margin-top:8px;overflow:hidden}
.tile .bar i{display:block;height:100%;background:var(--gold-d);border-radius:3px}

/* バッジ・タグ */
.tag{display:inline-flex;align-items:center;font-size:10.5px;font-weight:800;padding:2px 9px;border-radius:999px;white-space:nowrap;line-height:1.5}
.tag.pos{background:var(--green-l);color:var(--green)} .tag.neg{background:var(--red-l);color:var(--red)}
.tag.k{background:var(--blue-l);color:var(--deep)} .tag.g{background:var(--gold-l);color:#7A5A0A}
.tag.mut{background:var(--line-2);color:var(--mut)} .tag.amb{background:var(--amber-l);color:var(--amber)}
.tag.plan{background:var(--blue-l);color:var(--deep)} .tag.actual{background:var(--gold-l);color:#7A5A0A}
.tag.csv{background:var(--line-2);color:var(--mut);font-size:9.5px;padding:1px 6px}
.tag.fix{background:var(--green-l);color:var(--green);font-size:9.5px;padding:1px 6px}
.tag.tmp{background:var(--amber-l);color:var(--amber);font-size:9.5px;padding:1px 6px}
.tag.ovr{background:var(--blue-l);color:var(--deep);font-size:9.5px;padding:1px 6px}

/* 凡例 */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2);font-weight:600;margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend i.line{width:14px;height:2px;border-radius:1px}

/* SVGチャート */
.chart{width:100%;display:block;overflow:visible}
.chart text{font-family:inherit}
.chart .ax{font-size:10.5px;fill:var(--mut);font-weight:600}
.chart .grid{stroke:var(--line-2);stroke-width:1}
.chart .base{stroke:var(--line);stroke-width:1}
.chart .lbl{font-size:10.5px;font-weight:700;fill:var(--ink-2)}
.chart .lbl.pos{fill:var(--green)} .chart .lbl.neg{fill:var(--red)}
.chart .hit{fill:transparent;cursor:default}
.chart .hit:hover{fill:rgba(26,20,10,.04)}
.tip{position:fixed;z-index:100;pointer-events:none;background:var(--ink);color:#fff;font-size:11.5px;line-height:1.6;padding:7px 10px;border-radius:8px;
  box-shadow:0 6px 20px rgba(0,0,0,.18);opacity:0;transition:opacity .08s;max-width:260px;white-space:pre-line}
.tip.on{opacity:1}
.tip b{color:var(--gold)}

/* 帯グラフ（費用の構成） */
.band{display:flex;height:26px;border-radius:7px;overflow:hidden;gap:2px;background:var(--line-2)}
.band i{display:block;height:100%;min-width:2px}
.band-rows{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.band-row{display:grid;grid-template-columns:14px 92px 1fr auto auto;gap:8px;align-items:center;font-size:12px}
.band-row i{width:10px;height:10px;border-radius:3px;display:inline-block}
.band-row .t{height:6px;background:var(--line-2);border-radius:3px;overflow:hidden}
.band-row .t b{display:block;height:100%;border-radius:3px}
.band-row .v{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;min-width:56px}
.band-row .p{color:var(--mut);font-size:11px;min-width:34px;text-align:right}
.band-row.sub{opacity:.8;font-size:11.5px}
.band-row.sub .v{font-weight:600}
details.dd summary{cursor:pointer;font-size:11.5px;color:var(--mut);font-weight:700;list-style:none;margin-top:8px}
details.dd summary::before{content:"▸ ";} details.dd[open] summary::before{content:"▾ ";}

/* リスト・表 */
table{width:100%;border-collapse:collapse}
th{font-size:11px;color:var(--mut);text-align:left;font-weight:700;padding:9px 14px;border-bottom:1px solid var(--line);background:var(--soft);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle;font-size:13px}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.num{font-weight:600}
tr.pick{cursor:pointer} tr.pick:hover{background:var(--gold-xl)}
tr.tot td{background:var(--soft);font-weight:800;border-top:2px solid var(--line)}
.pos{color:var(--green)} .neg{color:var(--red)} .mut{color:var(--mut)}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.row:last-child{border-bottom:none}
.row .k{color:var(--ink-2);flex:1;min-width:0}
.row .v{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.row.b{font-weight:800} .row.b .k{color:var(--ink)}
.row.sep{border-bottom:2px solid var(--line);padding:0;margin:2px 0}
.row .in{width:120px;text-align:right}
.empty{text-align:center;color:var(--mut);padding:30px 16px;font-size:13px;line-height:1.8}
.empty b{display:block;font-size:14px;color:var(--ink-2);margin-bottom:4px}
.note{font-size:11.5px;color:var(--mut);line-height:1.7}
.msg{font-size:12px;font-weight:700;padding:8px 12px;border-radius:8px;margin-top:8px}
.msg.ok{background:var(--green-l);color:var(--green)} .msg.ng{background:var(--red-l);color:var(--red)} .msg.busy{background:var(--soft);color:var(--mut)}
.alert{font-size:12px;font-weight:700;padding:9px 12px;border-radius:9px;background:var(--red-l);color:var(--red);border:1px solid #E8C4BE;margin-bottom:12px}
.info{font-size:12px;padding:8px 12px;border-radius:9px;background:var(--amber-l);color:var(--amber);border:1px solid #E8D5A8;margin-bottom:12px}

/* 入力 */
input[type=text],input[type=number],input[type=date],textarea,select{width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:var(--card);font-size:13px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--gold-d);box-shadow:0 0 0 3px rgba(245,204,82,.25)}
textarea{line-height:1.7;resize:vertical}
input[type=number]{text-align:right;font-variant-numeric:tabular-nums}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;font-weight:700;color:var(--ink-2);margin-bottom:4px}
.fld .hint{font-size:11px;color:var(--mut);margin-bottom:5px}
.fld.free{background:var(--gold-xl);border:1px dashed #E2B93C;border-radius:12px;padding:12px 14px}
.kgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kf{background:var(--soft);border:1px solid var(--line-2);border-radius:10px;padding:9px 12px;min-width:0}
.kf .l{font-size:10.5px;font-weight:700;color:var(--mut)}
.kf .v{font-size:16px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums;word-break:break-word}
.kf.txt .v{font-size:12.5px;font-weight:500;line-height:1.7;white-space:pre-wrap}
.kf.wide{grid-column:1/-1}
.kf input,.kf textarea{margin-top:4px;padding:6px 9px;font-size:13px}

/* 機械カード */
.mach{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}

<body>
<div id="app"><div class="empty" style="padding-top:120px"><b>読み込み中…</b>Google Sheets から今年度のデータを取り寄せています</div></div>
<div class="tip" id="tip"></div>

<script>
var APP_VERSION='v28';
// ===== 以下は v24 から引き継いだ計算・取込ロジック（画面は含まない） =====
var FM=['5月','6月','7月','8月','9月','10月','11月','12月','1月','2月','3月','4月'];
// ── 年度（5月始まり） ────────────────────────────────────────
var BASE_FY=2025; // 既存クラウドデータ（接頭辞なし）＝2025年度として扱う
function curFY(){var d=new Date(),y=d.getFullYear(),m=d.getMonth()+1;return m>=5?y:y-1;}
function fyLabel(fy){return fy+'年度';}
function fyRange(fy){return fy+'年5月〜'+(fy+1)+'年4月';}
// GAS保存キーの接頭辞（2025年度は接頭辞なし＝既存データ互換）
function pfx(fy){return fy===BASE_FY?'':('FY'+fy+'_');}
function gkey(fy,m){return pfx(fy)+m;}
function parseGkey(k){var mm=/^FY(\d{4})_([\s\S]+)$/.exec(k);return mm?{fy:+mm[1],m:mm[2]}:{fy:BASE_FY,m:k};}
// CSV等の単一スロット保存に年度タグを付けて、再読込時に正しい年度へ復元する
function tagName(fy,name){return '[FY'+fy+'] '+(name||'');}
function parseName(s){var mm=/^\[FY(\d{4})\]\s*([\s\S]*)$/.exec(s||'');return mm?{fy:+mm[1],name:mm[2]}:{fy:null,name:s};}
// 年度ごとに分離して保持するフィールド
var YEAR_FIELDS=['kpiData','reports','finNotes','formAnswers','csv','csvName','raw','bsData','bsName','bizCsv','bizCsvName'];
function yearDefaults(){return{kpiData:{},reports:{},finNotes:{},formAnswers:{},csv:'',csvName:'CSVをアップロードしてください',raw:{},bsData:{},bsName:'残高試算表をアップロード',bizCsv:null,bizCsvName:'部門別CSVをアップロード'};}
function ensureYear(fy){if(!S.years[fy])S.years[fy]=yearDefaults();return S.years[fy];}
function stashActive(){var b=ensureYear(S.fy);YEAR_FIELDS.forEach(function(f){b[f]=S[f];});}
function activateYear(fy){var b=ensureYear(fy);S.fy=fy;YEAR_FIELDS.forEach(function(f){S[f]=b[f];});}
function switchYear(fy){if(fy===S.fy)return;stashActive();S.selMonth='5月';S.view='trend';S.sec='finance';S.repMode='view';S.kpiEditMode=null;S.finEditPl=null;activateYear(fy);render();}
// 全年度の財務メモを1つのオブジェクトに統合（GASは1スロット保存のため）
function allFinNotes(){stashActive();var out={};Object.keys(S.years).forEach(function(fy){var fn=S.years[fy].finNotes||{};Object.keys(fn).forEach(function(m){out[gkey(+fy,m)]=fn[m];});});return out;}
// 全年度のフォーム回答を統合
function allFormAnswers(){stashActive();var out={};Object.keys(S.years).forEach(function(fy){var fa=S.years[fy].formAnswers||{};Object.keys(fa).forEach(function(m){out[gkey(+fy,m)]=fa[m];});});return out;}
// GASから取得した月キー辞書を年度バケットへ振り分け
function distribute(obj,field){if(!obj)return;Object.keys(obj).forEach(function(k){var p=parseGkey(k);ensureYear(p.fy)[field][p.m]=obj[k];});}
// 選択中の年度バケットへformAnswersをマージ
function mergeFormAnswers(obj){distribute(obj,'formAnswers');S.formAnswers=ensureYear(S.fy).formAnswers;}
// 選択できる年度の上限
function maxFY(){var ys=[BASE_FY,curFY()+1].concat(Object.keys(S.years||{}).map(Number));return Math.max.apply(null,ys);}
var IQS=[
  {key:'biz',q:'各事業の進捗は？（プール工事・ランドリーのシステム導入・宿泊施設の工事 など）',hint:'例：プール工事は基礎着工／ランドリーのシステム導入は来月予定／宿泊施設は内装工事中'},
  {key:'issues',q:'現在の課題・リスクは？',hint:'例：転勤シーズンで退会増加リスク'},
  {key:'finance2',q:'来月の大型支出・資金調達は？',hint:'例：コインランドリー購入予定'},
  {key:'ceo',q:'経営者コメント（スタッフへのメッセージ）',hint:'今月の振り返りと来月への意気込みを'},
  {key:'free_note',q:'備考・追加指示（AIへの自由記述）',hint:'例：特に財務の厳しさを強調してほしい／退会対策に重点を置いて／全体的に前向きなトーンで'},
];
var KPI_FIELDS=[
  ['aqxia_sales','AQXIA 売上','man','売上'],
  ['air_sales','AIR 売上','man','売上'],
  ['total_sales','合計売上','man','売上'],
  ['aqxia_arpu','AQXIA ARPU（円/月）','yen','売上'],
  ['air_arpu','AIR ARPU（円/月）','yen','売上'],
  ['total_transactions','売上件数','num','売上'],
  ['cashless_ratio','キャッシュレス率','pct','売上'],
  ['personal_sales','パーソナル売上','man','売上'],
  ['personal_sessions','パーソナル件数','num','売上'],
  ['members_start','月初会員数','mei','会員'],
  ['members_end','月末会員数','mei','会員'],
  ['new_members','入会者数','mei','会員'],
  ['left_members','退会者数','mei','会員'],
  ['churn_rate','退会率','pct','会員'],
  ['age_50s_pct','50代比率','pct','会員'],
  ['age_60s_pct','60代比率','pct','会員'],
  ['female_pct','女性比率','pct','会員'],
  ['peak_hour','ピーク時間帯','str','稼働'],
  ['low_hour','課題時間帯','str','稼働'],
  ['low_slots','低稼働枠数','num','稼働'],
  ['cash_balance','現金残高','man','財務'],
  ['highlights','ハイライト','str','所感'],
  ['lowlights','ローライト','str','所感'],
  ['laundry_sales','売上合計','man','コインランドリー'],
  ['laundry_dryer_m','乾燥機(中) 売上','man','コインランドリー'],
  ['laundry_dryer_l','乾燥機(大) 売上','man','コインランドリー'],
  ['laundry_washer','洗濯乾燥機 売上','man','コインランドリー'],
  ['laundry_washer_v','洗濯機 売上','man','コインランドリー'],
  ['laundry_changer','両替機（抜取）','man','コインランドリー'],
  ['laundry_util','稼働率(推定)','pct','コインランドリー'],
  ['laundry_expense','経費合計','man','コインランドリー'],
  ['laundry_gas','ガス代','man','コインランドリー'],
  ['laundry_electric','電気代','man','コインランドリー'],
  ['laundry_water','水道代','man','コインランドリー'],
  ['laundry_labor','人件費','man','コインランドリー'],
  ['laundry_op','営業利益','man','コインランドリー'],
  ['laundry_note','メモ','str','コインランドリー'],
];

function fmtM(v){if(v==null||v===''||isNaN(v))return'—';var n=Math.round(v/10000);return(v<0?'▲':'')+Math.abs(n).toLocaleString()+'万';}
function fmtM1(v){if(v==null||v===''||isNaN(v))return'—';var n=Math.round(Math.abs(v)/1000)/10;return(v<0?'▲':'')+n.toLocaleString(undefined,{minimumFractionDigits:1,maximumFractionDigits:1})+'万';}
function fmtY(v){if(v==null||v==='')return'—';return(v<0?'▲':'')+Math.abs(Math.round(v)).toLocaleString()+'円';}
function fmtN(v,u){return(v==null||v==='')?(u?'—':'—'):Number(v).toLocaleString()+(u||'');}
function fmtKpi(v,unit){
  if(v==null||v==='')return'—';
  if(unit==='man')return fmtM(v);
  if(unit==='yen')return fmtY(v);
  if(unit==='pct')return v+'%';
  if(unit==='mei')return Number(v).toLocaleString()+'名';
  if(unit==='num')return Number(v).toLocaleString()+'件';
  return String(v);
}
function colV(v){return v>0?C.green:v<0?C.red:C.textX;}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function csvSplit(line){
  var r=[],cur='',inQ=false;
  for(var i=0;i<line.length;i++){var c=line[i];if(c==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++;}else{inQ=!inQ;}}else if(c===','&&!inQ){r.push(cur.trim());cur='';}else{cur+=c;}}
  r.push(cur.trim());return r;
}
// CSVの月見出しを正規化（"2026年5月"/"05月"/"2026/05"/"5月" → "5月"）
function csvMonthLabel(s){
  if(s==null)return null;
  s=String(s).trim();
  var m=/(?:\d{2,4}\s*年\s*)?0*(\d{1,2})\s*月/.exec(s);
  if(!m){var m2=/^\d{4}\s*[\/\-\.]\s*0*(\d{1,2})(?:\s*[\/\-\.]\s*\d{1,2})?$/.exec(s);if(m2)m=m2;}
  if(!m)return null;
  var n=parseInt(m[1],10);
  return(n>=1&&n<=12)?(n+'月'):null;
}
function parseCSV(text){
  if(!text||!text.trim())return{};
  var lines=text.split(/\r?\n/).filter(function(l){return l.trim();});
  // ヘッダー行＝月ラベルが最も多く並ぶ行を採用（年付き表記にも対応）
  var hdrLine=null,bestCount=0;
  for(var i=0;i<lines.length;i++){
    var cells=csvSplit(lines[i]),c=0;
    for(var k=0;k<cells.length;k++){if(csvMonthLabel(cells[k]))c++;}
    if(c>bestCount){bestCount=c;hdrLine=lines[i];}
  }
  if(!hdrLine||bestCount<1)return{};
  var hdr=csvSplit(hdrLine),midx={};
  for(var i=0;i<hdr.length;i++){var lbl=csvMonthLabel(hdr[i]);if(lbl&&FM.indexOf(lbl)>=0&&midx[lbl]==null)midx[lbl]=i;}
  if(!Object.keys(midx).length)return{};
  var data={};
  lines.forEach(function(line){
    var cs=csvSplit(line);
    var label=(cs[0]===''&&cs.length>1&&cs[1])?cs[1]:cs[0];
    if(!label)return;
    var vals={};
    FM.forEach(function(m){var i=midx[m];if(i==null||i>=cs.length){vals[m]=0;return;}var raw=cs[i].replace(/,/g,'');vals[m]=(raw!==''&&!isNaN(parseInt(raw)))?parseInt(raw):0;});
    if(Object.values(vals).some(function(v){return v!==0;})&&!data[label])data[label]=vals;
  });
  return data;
}

// ── 損益CSV：自動判定（月次推移 or 残高試算表/期間合計） ──────
function parsePL(text){
  var trend=parseCSV(text);
  if(Object.keys(trend).length>0)return{raw:trend,mode:'trend',month:null};
  var bal=parsePlBalance(text);
  if(bal&&Object.keys(bal.raw).length>0)return bal;
  return{raw:{},mode:'none',month:null};
}
// 残高試算表形式の損益計算書（月の列が無く、期間合計が1列）を取り込む
function parsePlBalance(text){
  if(!text||!text.trim())return null;
  var lines=text.split(/\r?\n/).filter(function(l){return l.trim();});
  var hi=-1;
  for(var i=0;i<lines.length;i++){if(lines[i].indexOf('勘定科目')>=0&&(lines[i].indexOf('終了月')>=0||lines[i].indexOf('期間')>=0)){hi=i;break;}}
  if(hi<0)return null;
  var hdr=csvSplit(lines[hi]);
  // 金額列：まず「終了月」を含む列、無ければ「期間貸方/借方」より後ろの数値列
  var valIdx=-1;
  for(var c=0;c<hdr.length;c++){if(String(hdr[c]).indexOf('終了月')>=0){valIdx=c;break;}}
  if(valIdx<0)for(var c=hdr.length-1;c>=0;c--){if(/借方|貸方|金額|残高/.test(String(hdr[c]))){valIdx=c;break;}}
  if(valIdx<0)return null;
  // 対象月：開始月の日付から（例 開始月:2026-05-01 → 5月）
  var month=null;
  var dm=/開始月[^0-9]*(\d{4})[^0-9](\d{1,2})/.exec(lines[hi]);
  if(dm){var n=parseInt(dm[2],10);if(n>=1&&n<=12)month=n+'月';}
  if(!month){var any=/(\d{4})[-\/.年](\d{1,2})/.exec(lines[hi]);if(any){var n2=parseInt(any[2],10);if(n2>=1&&n2<=12)month=n2+'月';}}
  if(!month)month='5月';
  var raw={};
  for(var i=hi+1;i<lines.length;i++){
    var cs=csvSplit(lines[i]);
    var label=(cs[0]&&cs[0]!=='')?cs[0]:(cs[1]||'');
    if(!label)continue;
    var rv=(cs[valIdx]!=null?cs[valIdx]:'').replace(/[,円"]/g,'').replace(/%$/,'');
    var v=parseFloat(rv);if(isNaN(v))v=0;
    if(v!==0&&!raw[label]){raw[label]={};FM.forEach(function(m){raw[label][m]=0;});raw[label][month]=v;}
  }
  return{raw:raw,mode:'balance',month:month};
}
// 列: 勘定科目, 補助科目, スポーツクラブ部門, 宿泊施設部門, コインランドリー, 共通費, 合計
function parseBizCSV(text){
  if(!text||!text.trim())return null;
  var lines=text.split(/\r?\n/).filter(function(l){return l.trim();});
  // ヘッダー行を探す（"スポーツクラブ"を含む行）
  var hdr=null,hIdx=-1;
  for(var i=0;i<lines.length;i++){
    if(lines[i].indexOf('スポーツクラブ')>=0){hdr=csvSplit(lines[i]);hIdx=i;break;}
  }
  if(!hdr)return null;
  // 列インデックスを取得
  function ci(keyword){for(var j=0;j<hdr.length;j++){if(hdr[j].indexOf(keyword)>=0)return j;}return -1;}
  var cols={
    label:0, sub:1,
    gym: ci('スポーツクラブ'),
    stay: ci('宿泊'),
    laundry: ci('コインランドリー'),
    common: ci('共通費'),
    total: ci('合計'),
  };
  // 結果オブジェクト
  var result={gym:{},stay:{},laundry:{},common:{},total:{}};
  var currentSection='';
  for(var i=hIdx+1;i<lines.length;i++){
    var cs=csvSplit(lines[i]);
    if(!cs.length)continue;
    var label=cs[0]?cs[0].trim():'';
    var sub=cs[1]?cs[1].trim():'';
    // セクション見出し（勘定科目のみ、補助科目なし、数値なし）
    if(label&&!sub){
      currentSection=label;
      // 合計行は数値を拾う
      if(label.indexOf('合計')>=0||label==='営業利益'||label==='経常利益'||label==='当期純利益'||label==='税引前当期純利益'){
        var key=label;
        ['gym','stay','laundry','common','total'].forEach(function(bk){
          var idx=cols[bk];if(idx<0||idx>=cs.length)return;
          var raw=(cs[idx]||'').replace(/,/g,'');
          if(raw!==''&&!isNaN(parseInt(raw)))result[bk][key]=parseInt(raw);
        });
      }
      continue;
    }
    // 補助科目がある場合 → 補助科目名で記録
    // 補助科目がない場合 → 勘定科目名で記録
    var key=sub||label;
    if(!key)continue;
    ['gym','stay','laundry','common','total'].forEach(function(bk){
      var idx=cols[bk];if(idx<0||idx>=cs.length)return;
      var raw=(cs[idx]||'').replace(/,/g,'');
      if(raw!==''&&!isNaN(parseInt(raw))){
        var v=parseInt(raw);
        // 同名キーは加算（補助科目なし + 補助科目あり の重複対策）
        result[bk][key]=(result[bk][key]||0)+v;
      }
    });
  }
  return result;
}
function getMonthData(m){
  function g(k){var d=S.raw[k];if(!d)return 0;var v=d[m];return(v!=null&&v!=='')?Number(v):0;}
  function has(k){var d=S.raw[k];return !!(d&&d[m]!=null&&d[m]!=='');}
  var rev=has('売上高合計')?g('売上高合計'):g('売上高');
  var cogs=g('売上原価合計');
  return{month:m,
    rev:rev,
    cogs:cogs,
    gross:has('売上総利益')?g('売上総利益'):(rev-cogs),
    sg:g('販売費及び一般管理費合計'),
    op:g('営業利益'),
    eco:g('経常利益'),
    net:g('当期純利益')};
}
// 手入力修正（finNotes[m].pl_temp）を反映した実効値。月別財務タブと同じロジックで全体ビューにも使う
var EFF_SG_KEYS=['役員報酬','給料賃金','法定福利費','業務委託料','地代家賃','水道光熱費','備品・消耗品費','広告宣伝費','通信費'];
function getEffData(m){
  var note=S.finNotes[m]||{},pt=note.pl_temp||{};
  function gRaw(key){var d=S.raw[key];if(!d)return 0;var v=d[m];return(v!=null&&v!=='')?(+v)||0:0;}
  function gPt(key){var e=pt[key];if(e==null)return null;if(typeof e==='object')return e;return{v:e,confirmed:false};}
  function eff(key){var p=gPt(key);if(p!=null&&p.v!=null){if(p.confirmed)return p.v;var rw=gRaw(key);return rw!==0?rw:p.v;}return gRaw(key);}
  // 各項目は「手入力があればその値、なければCSV」。合計はそれらから再計算（無編集ならCSVと一致）
  var effRev=eff('売上高合計')||eff('売上高');
  var effCogs=eff('売上原価合計');
  var effGross=effRev-effCogs;                          // 売上総利益＝売上高−売上原価
  // 販管費合計＝CSV合計行 ＋ 8科目の手入力による増減（未編集ならCSVと一致）
  var effSg=gRaw('販売費及び一般管理費合計');
  EFF_SG_KEYS.forEach(function(k){effSg+=eff(k)-gRaw(k);});
  var effOp=effGross-effSg;                             // 営業利益
  var effEco=effOp+gRaw('営業外収益合計')-gRaw('営業外費用合計'); // 経常利益
  var effNet=effEco+(gRaw('当期純利益')-gRaw('経常利益'));        // 純利益（特別損益・税金を保持）
  return{month:m,rev:effRev,cogs:effCogs,gross:effGross,sg:effSg,op:effOp,eco:effEco,net:effNet};
}
// その月に「仮」（未確定の手入力）が1つでも含まれるか
function hasTempMonth(m){var n=S.finNotes[m];if(!n||!n.pl_temp)return false;return Object.keys(n.pl_temp).some(function(k){var e=n.pl_temp[k];if(e==null)return false;var isTemp=(typeof e==='object')?(e.v!=null&&!e.confirmed):true;if(!isTemp)return false;var d=S.raw[k];var raw=(d&&d[m]!=null&&d[m]!=='')?(+d[m])||0:0;return raw===0;});}

function parseBsCSV(text){
  if(!text||!text.trim())return{};
  var lines=text.split(/\r?\n/).filter(function(l){return l.trim();});
  var data={};
  lines.forEach(function(line){
    var cs;
    try{
      var re=/"(?:[^"]|"")*"|[^,]*/g;
      cs=(line.match(re)||[]).map(function(s){return s.replace(/^"|"$/g,'').replace(/""/g,'"');});
    }catch(e){cs=line.split(',');}
    // 列0: 合計行ラベル（例:「現金及び預金合計」）
    // 列1: 勘定科目（例:「普通預金」）
    // 列2: 補助科目（例:「沖縄海邦銀行」）→ 無視
    // 列6: 残高（終了月残高）
    var label='';
    if(cs[0]&&cs[0].trim())label=cs[0].trim();         // 合計行 or セクション見出し
    else if(cs[1]&&cs[1].trim())label=cs[1].trim();    // 明細行（勘定科目）
    if(!label)return;
    // 補助科目行（列2に値あり）は合算しないためスキップ
    if(cs[2]&&cs[2].trim())return;
    var raw=(cs[6]||'').replace(/,/g,'');
    var val=(raw!==''&&raw!==undefined&&!isNaN(parseInt(raw)))?parseInt(raw):null;
    if(val!==null&&!data[label])data[label]=val;
  });
  return data;
}

async function extractDocxText(ab){
  if(typeof JSZip==='undefined')throw new Error('JSZipが読み込まれていません');
  var zip=await JSZip.loadAsync(ab);
  var xmlFile=zip.file('word/document.xml');
  if(!xmlFile)throw new Error('word/document.xmlが見つかりません');
  var xml=await xmlFile.async('text');
  return xml
    .replace(/<w:p[ >]/g,'\n<w:p ')
    .replace(/<w:br[^/]*\/>/g,'\n')
    .replace(/<[^>]+>/g,'')
    .replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').replace(/&apos;/g,"'").replace(/&quot;/g,'"')
    .replace(/[ \t]+/g,' ')
    .split('\n').map(function(l){return l.trim();}).filter(function(l){return l;}).join('\n')
    .slice(0,6000);
}

function lnum(v){if(v==null||v==='')return null;if(typeof v==='number')return Math.round(v);var n=parseFloat(String(v).replace(/[,円%\s]/g,''));return isNaN(n)?null:Math.round(n);}
function lmonth(d){if(d instanceof Date&&!isNaN(d))return(d.getMonth()+1)+'月';var mm=/(\d{1,2})\s*月/.exec(String(d));if(mm)return parseInt(mm[1],10)+'月';var dm=/\d{4}\D(\d{1,2})\D\d{1,2}/.exec(String(d));if(dm)return parseInt(dm[1],10)+'月';return null;}
// コインランドリー売上管理Excelを解析（月次サマリー＋損益サマリー）
function parseLaundryXlsx(buf){
  var wb=XLSX.read(buf,{type:'array',cellDates:true});
  function findSheet(kw){var n=null;wb.SheetNames.forEach(function(s){if(n==null&&s.indexOf(kw)>=0)n=s;});return n?wb.Sheets[n]:null;}
  var months={},fy=null;
  function ensure(m){if(!months[m])months[m]={};return months[m];}
  // 月次サマリー：売上・機器別・両替機・稼働率
  var ws=findSheet('月次サマリー');
  if(ws){
    var rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true});
    var hi=-1;for(var i=0;i<rows.length;i++){if((rows[i]||[]).some(function(c){return String(c).indexOf('月次売上合計')>=0;})){hi=i;break;}}
    if(hi>=0){
      var hdr=(rows[hi]||[]).map(function(c){return String(c==null?'':c);});
      function col(kw){for(var c=0;c<hdr.length;c++){if(hdr[c].indexOf(kw)>=0)return c;}return -1;}
      var cDm=col('乾燥機(中)'),cDl=col('乾燥機(大)'),cW=col('洗濯乾燥機'),cWv=col('洗濯機'),cTot=col('月次売上合計'),cChg=col('両替機'),cUtil=col('稼働率');
      for(var i=hi+1;i<rows.length;i++){
        var r=rows[i]||[];var ml=lmonth(r[0]);if(!ml)continue;
        if(fy==null&&r[0] instanceof Date){var y=r[0].getFullYear(),mo=r[0].getMonth()+1;fy=mo>=5?y:y-1;}
        var o=ensure(ml);
        if(cTot>=0)o.laundry_sales=lnum(r[cTot]);
        if(cDm>=0)o.laundry_dryer_m=lnum(r[cDm]);
        if(cDl>=0)o.laundry_dryer_l=lnum(r[cDl]);
        if(cW>=0)o.laundry_washer=lnum(r[cW]);
        if(cWv>=0)o.laundry_washer_v=lnum(r[cWv]);
        if(cChg>=0)o.laundry_changer=lnum(r[cChg]);
        if(cUtil>=0){var u=r[cUtil];if(u!=null&&u!==''){var uf=parseFloat(u);if(!isNaN(uf))o.laundry_util=uf<=1?Math.round(uf*1000)/10:Math.round(uf*10)/10;}}
      }
    }
  }
  // 損益サマリー：経費合計・人件費・営業利益
  var ps=findSheet('損益サマリー');
  if(ps){
    var prows=XLSX.utils.sheet_to_json(ps,{header:1,raw:true});
    var phi=-1;for(var i=0;i<prows.length;i++){if((prows[i]||[]).some(function(c){return String(c).indexOf('項目')>=0;})){phi=i;break;}}
    if(phi>=0){
      var colMonth={};(prows[phi]||[]).forEach(function(c,ci){var ml=lmonth(c);if(ml)colMonth[ci]=ml;});
      function rowByLabel(kw){for(var i=phi+1;i<prows.length;i++){var r=prows[i]||[];for(var c=0;c<r.length;c++){if(String(r[c]).indexOf(kw)>=0)return r;}}return null;}
      function applyRow(kw,field){var r=rowByLabel(kw);if(!r)return;Object.keys(colMonth).forEach(function(c){var v=r[c];if(v!=null&&v!==''&&typeof v!=='object')ensure(colMonth[c])[field]=lnum(v);});}
      applyRow('経費合計','laundry_expense');
      applyRow('ガス','laundry_gas');
      applyRow('電気','laundry_electric');
      applyRow('水道','laundry_water');
      applyRow('人件費','laundry_labor');
      applyRow('営業利益','laundry_op');
    }
  }
  // 稼働率分析：機種タイプ(M/L/XL)ごとに、各月の平均稼働率を算出
  var us=findSheet('稼働率分析');
  if(us){
    var urows=XLSX.utils.sheet_to_json(us,{header:1,raw:true});
    var acc={m:{},l:{},xl:{},v:{}};
    urows.forEach(function(row){
      var name=String((row&&row[0])||'');
      if(name.indexOf('No.')<0)return;
      var t=name.indexOf('乾燥機(中)')>=0?'m':name.indexOf('乾燥機(大)')>=0?'l':name.indexOf('洗濯乾燥機')>=0?'xl':name.indexOf('洗濯機')>=0?'v':null;
      if(!t)return;
      for(var k=0;k<12;k++){var c=3+3*k;var v=row[c];if(v!=null&&v!==''&&!isNaN(parseFloat(v))){(acc[t][FM[k]]=acc[t][FM[k]]||[]).push(parseFloat(v));}}
    });
    ['m','l','xl','v'].forEach(function(t){Object.keys(acc[t]).forEach(function(ml){var arr=acc[t][ml];var avg=arr.reduce(function(a,b){return a+b;},0)/arr.length;ensure(ml)['laundry_util_'+t]=Math.round(avg*1000)/10;});});
  }
  // 値がすべて0/空の月は取り込み対象外
  Object.keys(months).forEach(function(m){var o=months[m];var any=Object.keys(o).some(function(k){var v=o[k];return v!=null&&v!==0&&v!=='';});if(!any)delete months[m];});
  return{months:months,fy:fy};
}

  if(!file)return;
  if(!/\.xlsx$/i.test(file.name)){S.laundryMsg='⚠️ .xlsx ファイルを選んでください';render();return;}

async function extractPdfText(ab){

    var page=await pdf.getPage(i);

    texts.push(content.items.map(function(item){return item.str;}).join(' '));
  }
  return texts.join('\n').replace(/[ \t]+/g,' ').slice(0,6000);
}

async function handleKpi(file){
  if(!file)return;
  S.kpiLoading=true;S.kpiMsg='📄 読み込み中...';render();
  try{
    var text='';
    if(file.name.endsWith('.pdf')){var ab=await file.arrayBuffer();text=await extractPdfText(ab);}
    else if(file.name.endsWith('.docx')||file.name.endsWith('.doc')){var ab=await file.arrayBuffer();text=await extractDocxText(ab);}
    else{text=await file.text();}
    if(!text||text.length<30)throw new Error('テキストが読み取れませんでした（'+text.length+'文字）');
    var kpi=null;
    if(S.gasConnected&&S.gasUrl&&S.auth){
      S.kpiMsg='🤖 AI解析中（GAS経由）...';render();
      var gr=await fetch(S.gasUrl,{method:'POST',body:JSON.stringify(withAuth({action:'extract_kpi',text:text.slice(0,5000)}))});
      var gj=await gr.json();
      if(gj&&gj.ok&&gj.kpi){kpi=gj.kpi;}else{throw new Error(gj&&gj.error?gj.error:'GAS経由の解析に失敗しました');}
    }else{
      S.kpiMsg='📊 データ解析中...';render();kpi=parseKpiFromText(text);
    }
    S.kpiData=Object.assign({},S.kpiData);S.kpiData[S.selMonth]=kpi;
    
    gasPost({action:'save_kpi',month:gkey(S.fy,S.selMonth),data:kpi});
    S.kpiMsg='✅ '+S.selMonth+'のKPIを取り込みました';S.sec='kpi';
  }catch(e){S.kpiMsg='⚠️ エラー: '+e.message;console.error('KPI error:',e);}
  S.kpiLoading=false;render();
  setTimeout(function(){S.kpiMsg='';render();},8000);
}

// ───────── ログイン（IDとパスワードは Apps Script 側のスクリプト プロパティで照合。HTMLには書かない） ─────────
function loadAuth(){try{var a=JSON.parse(localStorage.getItem('kd_auth')||'null');if(a&&a.id&&a.pw)S.auth=a;}catch(e){}}
function withAuth(o){return Object.assign({id:S.auth?S.auth.id:'',pw:S.auth?S.auth.pw:''},o);}
function authFailed(){S.auth=null;S.authMsg='IDかパスワードが違います';try{localStorage.removeItem('kd_auth');}catch(e){}render();}
function logout(){S.auth=null;S.authMsg='';S.years={};S.raw={};S.kpiData={};S.reports={};S.finNotes={};S.formAnswers={};S.bsData={};S.drawer=false;try{localStorage.removeItem('kd_auth');}catch(e){}render();}
function buildLogin(){
  return'<div class="login"><div class="login-box">'
    +'<div class="brand" style="margin-bottom:18px"><span class="mark"></span><div><b>タカバシラ</b><small>経営ダッシュボード</small></div></div>'
    +'<div class="fld"><label>ID（メールアドレス）</label><input id="lg-id" type="email" autocomplete="username" placeholder="info@…" value="'+esc((S.auth&&S.auth.id)||'')+'"/></div>'
    +'<div class="fld"><label>パスワード</label><input id="lg-pw" type="password" autocomplete="current-password"/></div>'
    +(S.authMsg?'<div class="msg ng" style="margin:0 0 10px">'+esc(S.authMsg)+'</div>':'')
    +'<button class="btn pri" style="width:100%;justify-content:center;padding:11px" data-act="login"'+(S.authBusy?' disabled':'')+'>'+(S.authBusy?'確認中…':'開く')+'</button>'
    +'<div class="note" style="margin-top:12px">この端末に記憶します。共有の端末では、右上「見方」の下にある「ログアウト」で消してください。</div>'
    +'</div></div>';
}
async function doLogin(){
  var id=(document.getElementById('lg-id')||{}).value||'',pw=(document.getElementById('lg-pw')||{}).value||'';
  id=id.trim();if(!id||!pw){S.authMsg='IDとパスワードを入れてください';render();return;}
  S.auth={id:id,pw:pw};S.authMsg='';S.authBusy=true;render();
  try{
    var r=await fetch(S.gasUrl,{method:'POST',body:JSON.stringify(withAuth({action:'ping'}))});var j=await r.json();
    if(j&&j.ok){try{localStorage.setItem('kd_auth',JSON.stringify(S.auth));}catch(e){}S.authBusy=false;render();loadGas();return;}
    S.authBusy=false;authFailed();
  }catch(e){S.authBusy=false;S.auth=null;S.authMsg='つながりません（'+e.message+'）';render();}
}

// ───────── 小さな部品 ─────────
function cls(){return Array.prototype.slice.call(arguments).filter(Boolean).join(' ');}
function signCls(v){return v>0?'pos':v<0?'neg':'';}
function tile(o){
  // o: {label, value, sub, cls, small, bar(0-1)}
  return'<div class="'+cls('tile',o.cls)+'">'
    +'<div class="l">'+lab(o.label)+'</div>'
    +'<div class="n">'+(o.html||esc(o.value))+(o.small?'<small>'+esc(o.small)+'</small>':'')+'</div>'
    +(o.sub?'<div class="s">'+esc(o.sub)+'</div>':'')+(o.d?'<div class="s">'+o.d+'</div>':'')
    +(o.bar!=null?'<div class="bar"><i style="width:'+Math.max(0,Math.min(100,Math.round(o.bar*100)))+'%"></i></div>':'')
    +'</div>';
}
function tag(t,c){return'<span class="tag '+(c||'mut')+'">'+esc(t)+'</span>';}
function secH(id,title,sub,right){return'<div class="sec-h" id="'+id+'-h"><h2>'+esc(title)+'</h2>'+(sub?'<span class="sub">'+esc(sub)+'</span>':'')+(right?'<div class="r">'+right+'</div>':'')+'</div>';}
function yen(v){return fmtY(v);}
function man(v){return fmtM(v);}
function pct(v,d){if(v==null||isNaN(v))return'—';var p=Math.pow(10,d||0);return(Math.round(v*p)/p)+'%';}
function monthNo(m){return m.replace('月','');}
function isCurMonth(m){var d=new Date();return S.fy===curFY()&&m===((d.getMonth()+1)+'月');}
function fmtDate(s){if(!s)return'';var m=/(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s);return m?(+m[2])+'/'+(+m[3]):s;}

// ───────── SVGチャート ─────────
// 縦棒（複数系列＝月ごとにグループ）。値ラベルは「最後の月だけ」。下段に純利益などの短いラベル行。
function svgBars(o){
  var W=640,H=o.h||190,padL=44,padR=10,padT=18,padB=o.foot?42:26;
  var months=o.months,series=o.series;
  var maxV=0;series.forEach(function(s){s.vals.forEach(function(v){if(v>maxV)maxV=v;});});
  if(maxV<=0)maxV=1;
  // 目盛りは切りのいい万円
  var ax=axisTicks(maxV),top=ax.top;
  var ih=H-padT-padB,iw=W-padL-padR;
  var slot=iw/months.length;var n=series.length;
  var bw=Math.min(24,(slot*0.62)/n);var gap=2;
  function y(v){return padT+ih-(v/top)*ih;}
  var lblIdx=o.labelIdx!=null?o.labelIdx:months.length-1;
  var out='<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="height:'+H+'px">';
  // 目盛り線
  ax.ticks.forEach(function(gv){var gy=y(gv);
    out+='<line class="'+(gv===0?'base':'grid')+'" x1="'+padL+'" x2="'+(W-padR)+'" y1="'+gy+'" y2="'+gy+'"/>';
    out+='<text class="ax" x="'+(padL-6)+'" y="'+(gy+4)+'" text-anchor="end">'+Math.round(gv/10000).toLocaleString()+'</text>';});
  months.forEach(function(m,i){
    var x0=padL+slot*i;var gx=x0+(slot-(bw*n+gap*(n-1)))/2;
    series.forEach(function(s,k){
      var v=s.vals[i]||0,h=Math.max(v>0?2:0,ih*(v/top));var bx=gx+k*(bw+gap),by=y(v);
      out+='<path d="'+roundTop(bx,by,bw,h,4)+'" fill="'+s.color+'"/>';
      if(i===lblIdx&&v>0)out+='<text class="lbl" x="'+(bx+bw/2)+'" y="'+(by-5)+'" text-anchor="middle">'+Math.round(v/10000).toLocaleString()+'</text>';
    });
    out+='<text class="ax" x="'+(x0+slot/2)+'" y="'+(H-padB+15)+'" text-anchor="middle">'+esc(monthNo(m))+'月</text>';
    if(o.foot){var f=o.foot[i];if(f)out+='<text class="lbl '+(f.cls||'')+'" x="'+(x0+slot/2)+'" y="'+(H-padB+31)+'" text-anchor="middle">'+esc(f.text)+'</text>';}
    out+='<rect class="hit" x="'+x0+'" y="'+padT+'" width="'+slot+'" height="'+(ih+padB-6)+'" data-tip="'+esc(o.tips?o.tips[i]:'')+'"/>';
  });
  out+='</svg>';
  return out;
}
function roundTop(x,y,w,h,r){if(h<=r)return'M'+x+' '+(y+h)+'h'+w+'v-'+h+'h-'+w+'z';
  return'M'+x+' '+(y+h)+'v-'+(h-r)+'a'+r+' '+r+' 0 0 1 '+r+' -'+r+'h'+(w-2*r)+'a'+r+' '+r+' 0 0 1 '+r+' '+r+'v'+(h-r)+'z';}
function axisTicks(mx){if(mx<=0)mx=1;var step=niceStep(mx/4);var top=Math.ceil(mx/step)*step;var n=Math.round(top/step);if(n>6){step*=2;top=Math.ceil(mx/step)*step;n=Math.round(top/step);}var t=[];for(var i=0;i<=n;i++)t.push(step*i);return{top:top,ticks:t};}
function niceStep(v){if(v<=0)return 1;var p=Math.pow(10,Math.floor(Math.log10(v)));var f=v/p;var s=f<=1?1:f<=2?2:f<=5?5:10;return s*p;}
// 折れ線（1系列）。端点だけ値を出す。マーカーは白リング付き。
function svgLine(o){
  var W=640,H=o.h||170,padL=44,padR=40,padT=18,padB=26;
  var months=o.months,vals=o.vals,color=o.color||CH.deep;
  var mx=Math.max.apply(null,vals.map(function(v){return Math.abs(v);}));if(mx<=0)mx=1;
  var hasNeg=vals.some(function(v){return v<0;});
  var ax=axisTicks(mx),top=ax.top;var bot=hasNeg?-top:0;
  var ih=H-padT-padB,iw=W-padL-padR;var slot=iw/Math.max(1,months.length);
  function y(v){return padT+ih-((v-bot)/(top-bot))*ih;}
  function x(i){return padL+slot*i+slot/2;}
  var out='<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="height:'+H+'px">';
  var ticks=hasNeg?[bot,0,top]:ax.ticks;
  ticks.forEach(function(gv){var gy=y(gv);out+='<line class="'+(gv===0?'base':'grid')+'" x1="'+padL+'" x2="'+(W-padR)+'" y1="'+gy+'" y2="'+gy+'"/>';
    out+='<text class="ax" x="'+(padL-6)+'" y="'+(gy+4)+'" text-anchor="end">'+(gv<0?'▲':'')+Math.round(Math.abs(gv)/10000).toLocaleString()+'</text>';});
  if(months.length){
    var pts=vals.map(function(v,i){return[x(i),y(v)];});
    var d=pts.map(function(p,i){return(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1);}).join('');
    out+='<path d="'+d+'L'+pts[pts.length-1][0].toFixed(1)+' '+y(0)+'L'+pts[0][0].toFixed(1)+' '+y(0)+'Z" fill="'+color+'" opacity=".08"/>';
    out+='<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>';
    pts.forEach(function(p,i){out+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="6" fill="#fff"/><circle cx="'+p[0]+'" cy="'+p[1]+'" r="4" fill="'+color+'"/>';});
    var last=pts[pts.length-1];
    out+='<text class="lbl" x="'+(last[0]+9)+'" y="'+(last[1]+4)+'">'+esc(o.endLabel||fmtM(vals[vals.length-1]))+'</text>';
  }
  months.forEach(function(m,i){out+='<text class="ax" x="'+x(i)+'" y="'+(H-padB+15)+'" text-anchor="middle">'+esc(monthNo(m))+'月</text>';
    out+='<rect class="hit" x="'+(padL+slot*i)+'" y="'+padT+'" width="'+slot+'" height="'+(ih+padB-6)+'" data-tip="'+esc(o.tips?o.tips[i]:'')+'"/>';});
  out+='</svg>';
  return out;
}

// 折れ線（複数系列・%用）。端に系列名を直接書く（色だけに頼らない）。validate_palette 済みの4色
var CH4=['#10539C','#B8860B','#3C8A5E','#8C4A9E'];
function svgLines(o){
  var W=640,H=o.h||190,padL=40,padR=118,padT=14,padB=26;
  var months=o.months,series=o.series;
  var mx=0;series.forEach(function(sr){sr.vals.forEach(function(v){if(v!=null&&v>mx)mx=v;});});if(mx<=0)mx=1;
  var ax=axisTicks(mx),top=ax.top;
  var ih=H-padT-padB,iw=W-padL-padR;var slot=iw/Math.max(1,months.length);
  function y(v){return padT+ih-(v/top)*ih;}function x(i){return padL+slot*i+slot/2;}
  var out='<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="height:'+H+'px">';
  ax.ticks.forEach(function(gv){var gy=y(gv);out+='<line class="'+(gv===0?'base':'grid')+'" x1="'+padL+'" x2="'+(W-padR)+'" y1="'+gy+'" y2="'+gy+'"/><text class="ax" x="'+(padL-6)+'" y="'+(gy+4)+'" text-anchor="end">'+Math.round(gv*10)/10+(o.unit||'')+'</text>';});
  var ends=[];
  series.forEach(function(sr,k){
    var pts=[];sr.vals.forEach(function(v,i){if(v!=null&&v!=='')pts.push([x(i),y(v),v]);});if(!pts.length)return;
    var d=pts.map(function(p,i){return(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1);}).join('');
    out+='<path d="'+d+'" fill="none" stroke="'+sr.color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>';
    pts.forEach(function(p){out+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="6" fill="#fff"/><circle cx="'+p[0]+'" cy="'+p[1]+'" r="4" fill="'+sr.color+'"/>';});
    var last=pts[pts.length-1];ends.push({y:last[1],x:last[0],name:sr.name,v:last[2],color:sr.color});
  });
  // 端のラベルが重ならないように上下にずらす
  ends.sort(function(a,b){return a.y-b.y;});for(var i=1;i<ends.length;i++){if(ends[i].y-ends[i-1].y<13)ends[i].y=ends[i-1].y+13;}
  ends.forEach(function(e){out+='<line x1="'+(e.x+5)+'" y1="'+e.y+'" x2="'+(W-padR+6)+'" y2="'+e.y+'" stroke="'+e.color+'" stroke-width="1" opacity=".5"/><text class="lbl" x="'+(W-padR+9)+'" y="'+(e.y+4)+'">'+esc(e.name)+' '+(Math.round(e.v*10)/10)+(o.unit||'')+'</text>';});
  months.forEach(function(m,i){out+='<text class="ax" x="'+x(i)+'" y="'+(H-padB+15)+'" text-anchor="middle">'+esc(monthNo(m))+'月</text><rect class="hit" x="'+(padL+slot*i)+'" y="'+padT+'" width="'+slot+'" height="'+(ih+padB-6)+'" data-tip="'+esc(o.tips?o.tips[i]:'')+'"/>';});
  return out+'</svg>';
}
// 積み上げ棒（機種別の売上）。段の間は2pxの白
function svgStack(o){
  var W=640,H=o.h||190,padL=44,padR=10,padT=18,padB=26;
  var months=o.months,series=o.series;
  var tots=months.map(function(_,i){return series.reduce(function(a,sr){return a+(sr.vals[i]||0);},0);});
  var mx=Math.max.apply(null,tots);var ax=axisTicks(mx),top=ax.top;
  var ih=H-padT-padB,iw=W-padL-padR;var slot=iw/months.length;var bw=Math.min(28,slot*0.55);
  function y(v){return padT+ih-(v/top)*ih;}
  var out='<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="height:'+H+'px">';
  ax.ticks.forEach(function(gv){var gy=y(gv);out+='<line class="'+(gv===0?'base':'grid')+'" x1="'+padL+'" x2="'+(W-padR)+'" y1="'+gy+'" y2="'+gy+'"/><text class="ax" x="'+(padL-6)+'" y="'+(gy+4)+'" text-anchor="end">'+Math.round(gv/10000).toLocaleString()+'</text>';});
  months.forEach(function(m,i){
    var x0=padL+slot*i+(slot-bw)/2,acc=0;
    series.forEach(function(sr,k){var v=sr.vals[i]||0;if(v<=0)return;var h=ih*(v/top);var yTop=y(acc+v);
      out+='<rect x="'+x0+'" y="'+(yTop+(acc?1:0))+'" width="'+bw+'" height="'+Math.max(0,h-(acc?1:0)-1)+'" fill="'+sr.color+'"'+(k===series.length-1||acc===0&&k===0?' rx="0"':'')+'/>';acc+=v;});
    if(tots[i]>0)out+='<text class="lbl" x="'+(x0+bw/2)+'" y="'+(y(tots[i])-5)+'" text-anchor="middle">'+Math.round(tots[i]/10000)+'</text>';
    out+='<text class="ax" x="'+(padL+slot*i+slot/2)+'" y="'+(H-padB+15)+'" text-anchor="middle">'+esc(monthNo(m))+'月</text><rect class="hit" x="'+(padL+slot*i)+'" y="'+padT+'" width="'+slot+'" height="'+(ih+padB-6)+'" data-tip="'+esc(o.tips?o.tips[i]:'')+'"/>';
  });
  return out+'</svg>';
}
function legend(series){return'<div class="legend">'+series.map(function(sr){return'<span><i style="background:'+sr.color+'"></i>'+esc(sr.name)+'</span>';}).join('')+'</div>';}

// コインランドリー 機種別の推移（稼働率＝折れ線／売上＝積み上げ）
function buildLaundryTrend(){
  var ms=FM.filter(function(m){var k=S.kpiData[m];return k&&(k.laundry_util_m!=null||k.laundry_dryer_m!=null);});
  if(ms.length<2)return'';
  var TYPES=[{name:'乾燥機M',u:'laundry_util_m',s:'laundry_dryer_m'},{name:'乾燥機L',u:'laundry_util_l',s:'laundry_dryer_l'},{name:'洗濯乾燥機XL',u:'laundry_util_xl',s:'laundry_washer'},{name:'洗濯機',u:'laundry_util_v',s:'laundry_washer_v'}];
  var uSer=TYPES.map(function(t,k){return{name:t.name,color:CH4[k],vals:ms.map(function(m){var v=S.kpiData[m][t.u];return v!=null&&v!==''?+v:null;})};}).filter(function(sr){return sr.vals.some(function(v){return v!=null;});});
  var sSer=TYPES.map(function(t,k){return{name:t.name,color:CH4[k],vals:ms.map(function(m){return +(S.kpiData[m][t.s]||0);})};}).filter(function(sr){return sr.vals.some(function(v){return v>0;});});
  var uTips=ms.map(function(m){var k=S.kpiData[m];return m+' 稼働率\n'+TYPES.map(function(t){return t.name+' '+(k[t.u]!=null?pct(k[t.u],1):'—');}).join('\n');});
  var sTips=ms.map(function(m){var k=S.kpiData[m];return m+' 売上\n'+TYPES.map(function(t){return t.name+' '+(k[t.s]!=null?fmtY(k[t.s]):'—');}).join('\n')+'\n合計 '+fmtY(k.laundry_sales);});
  // ひとこと：稼働率がいちばん高い機種と低い機種（直近月）
  var lk=S.kpiData[ms[ms.length-1]];var ranked=TYPES.filter(function(t){return lk[t.u]!=null;}).sort(function(a,b){return lk[b.u]-lk[a.u];});
  var note=ranked.length>=2?ms[ms.length-1]+'は '+ranked[0].name+'（'+pct(lk[ranked[0].u],1)+'）が最も動き、'+ranked[ranked.length-1].name+'（'+pct(lk[ranked[ranked.length-1].u],1)+'）が最も空いています。':'';
  return'<div class="grid g2" id="ltrend" style="margin-top:12px">'
    +'<div class="card"><div class="ch">'+lab('稼働率')+' 機種別の推移<span class="r">単位：%・各機種の全台平均</span></div>'+legend(uSer)+svgLines({months:ms,series:uSer,unit:'%',h:200,tips:uTips})+(note?'<div class="note" style="margin-top:6px">'+esc(note)+'</div>':'')+'</div>'
    +'<div class="card"><div class="ch">売上 機種別の推移<span class="r">単位：万円・上の数字は合計</span></div>'+legend(sSer)+svgStack({months:ms,series:sSer,h:200,tips:sTips})+'<div class="note" style="margin-top:6px">両替機の抜取は売上に含めていません。</div></div>'
    +'</div>';
}

// ───────── 上部（ブランド・年度・同期・取込） ─────────
function buildHeader(){
  var mx=maxFY();
  var st=S.dbLoading?'busy':(S.gasStatus.indexOf('⚠️')>=0?'ng':'');
  var stText=S.dbLoading?'同期中…':(S.gasStatus||'Sheets接続済');
  return'<header class="top"><div class="top-in">'
    +'<div class="brand"><span class="mark"></span><div><b>タカバシラ</b><small>経営ダッシュボード</small></div></div>'
    +'<div class="fy"><button data-act="fy-prev"'+(S.fy<=BASE_FY?' disabled':'')+' title="前の年度">◀</button><span>'+esc(fyLabel(S.fy))+'</span><button data-act="fy-next"'+(S.fy>=mx?' disabled':'')+' title="次の年度">▶</button></div>'
    +'<div class="sp"></div>'
    +'<div class="sync"><i class="'+st+'"></i>'+esc(stText.replace(/^[✅⚠️]\s*/,''))+'</div>'
    +'<button class="btn ghost" data-act="guide">見方</button>'
    +'<button class="btn" data-act="drawer">データ取込</button>'
    +'<span class="ver">'+APP_VERSION+'</span>'
    +'</div></header>';
}
function buildMonths(){
  var tabs=FM.map(function(m){
    var d=getEffData(m),on=S.view===m,hD=d.rev>0||d.sg>0;
    var hR=!!(S.reports[m]&&S.reports[m].text),hK=!!S.kpiData[m];
    return'<button class="'+cls('mtab',on&&'on',hD&&'has')+'" data-act="month" data-m="'+m+'">'
      +'<span class="n">'+esc(m)+'</span>'
      +'<span class="v '+(hD?signCls(d.net):'')+'">'+(isCurMonth(m)?'集計中':hD?fmtM(d.net):'—')+'</span>'
      +'<span class="dots"><i class="'+(hK?'k':'')+'"></i><i class="'+(hR?'r':'')+'"></i></span>'
      +'</button>';
  }).join('');
  return'<nav class="months"><div class="months-in">'
    +'<button class="'+cls('mtab all',S.view==='trend'&&'on')+'" data-act="month" data-m="trend"><span class="n">年度全体</span><span class="v">'+esc(fyRange(S.fy))+'</span></button>'
    +tabs+'</div></nav>';
}
function pills(items,cur){
  return'<div class="pills">'+items.map(function(p){return'<button class="'+cls('pill',cur===p[0]&&'on')+'" data-act="jump" data-to="'+p[0]+'">'+esc(p[1])+'</button>';}).join('')+'</div>';
}

// ───────── 年度全体 ─────────
function buildTrend(){
  var allD=FM.map(getEffData);
  var active=allD.filter(function(d){return d.rev>0||d.sg>0;});
  if(!active.length){
    return'<div class="card"><div class="empty" style="padding:56px 20px"><b>'+esc(fyLabel(S.fy))+'の損益データがまだありません</b>右上の「データ取込」から、マネーフォワードの損益計算書（月次推移）CSVを入れてください。</div></div>';
  }

    +tile({label:'コインランドリー 直近月売上',value:lastLaundry()?fmtM(lastLaundry().v):'—',cls:lastLaundry()?'':'dim',sub:lastLaundry()?(lastLaundry().m+'・稼働率 '+pct(lastLaundry().u,1)):'Excel未取込'})
    +'</div></section>';

  // ── 損益 ──
  var tips=active.map(function(d){return d.month+'\n売上 '+fmtY(d.rev)+'\n販管費 '+fmtY(d.sg)+'\n営業利益 '+fmtY(d.op)+'\n純利益 '+fmtY(d.net);});
  var maxRev=Math.max.apply(null,active.map(function(d){return d.rev;}));var lblIdx=months.length-1;while(lblIdx>0&&active[lblIdx].rev<maxRev*0.4)lblIdx--;
  var plChart=svgBars({months:months,h:210,labelIdx:lblIdx,

  var plHtml='<section class="sec" id="pl">'

  // ── 資金 ──

function sum(arr,k){return arr.reduce(function(s,d){return s+(d[k]||0);},0);}
function sumRaw(months,keys){return keys.reduce(function(s,k){var d=S.raw[k];if(!d)return s;return s+months.reduce(function(ss,m){var v=d[m];return ss+((v!=null&&v!=='')?+v:0);},0);},0);}
function lastLaundry(){var ms=FM.filter(function(m){var k=S.kpiData[m];return k&&k.laundry_sales;});if(!ms.length)return null;var m=ms[ms.length-1],k=S.kpiData[m];return{m:m,v:k.laundry_sales,u:k.laundry_util,op:k.laundry_op};}

// 「売上をどう使ったか」：販管費を 人件費／変動費／その他 の帯で。どんぶり図の置き換え。
function buildCostBand(months,totalRev,totalSg,totalOp){
  var G={
    jinken:{name:'人件費',color:CH.deep,keys:['役員報酬','給料賃金','法定福利費','福利厚生費','研修採用費','賞与']},
    hendou:{name:'変動費',color:CH.gold,keys:['水道光熱費','業務委託料','広告宣伝費','接待交際費','旅費交通費','荷造運賃']},
    sonota:{name:'家賃・その他固定費',color:'#8C8477',keys:['地代家賃','賃借料','リース代','通信費','保険料','租税公課','支払手数料','支払報酬','修繕費','備品・消耗品費','会議費','新聞図書費','諸会費','車両費','雑費']}
  };
  var parts=Object.keys(G).map(function(k){var g=G[k];var items=g.keys.map(function(kk){return{name:kk,v:sumRaw(months,[kk])};}).filter(function(x){return x.v>0;}).sort(function(a,b){return b.v-a.v;});
    return{key:k,name:g.name,color:g.color,v:items.reduce(function(s,x){return s+x.v;},0),items:items};});
  var known=parts.reduce(function(s,p){return s+p.v;},0);
  parts=parts.filter(function(p){return p.v>0;});
  var rest=totalSg-known;if(rest>0)parts.push({key:'rest',name:known>0?'その他':'販管費（内訳なし）',color:'#C4BEB0',v:rest,items:[]});
  var base=Math.max(totalRev,totalSg)||1;
  var band=parts.map(function(p){return'<i style="width:'+(p.v/base*100)+'%;background:'+p.color+'" data-tip="'+esc(p.name+' '+fmtM(p.v)+'（売上比 '+pct(totalRev?p.v/totalRev*100:null)+'）')+'"></i>';}).join('');
  var rows=parts.map(function(p){
    var sub=p.items.slice(0,4).map(function(x){return'<div class="band-row sub"><i></i><span>'+esc(x.name)+'</span><span class="t"><b style="width:'+(x.v/(p.v||1)*100)+'%;background:'+p.color+';opacity:.5"></b></span><span class="v">'+fmtM(x.v)+'</span><span class="p">'+pct(totalRev?x.v/totalRev*100:null)+'</span></div>';}).join('');
    return'<div class="band-row"><i style="background:'+p.color+'"></i><span style="font-weight:700">'+esc(p.name)+'</span><span class="t"><b style="width:'+(p.v/base*100)+'%;background:'+p.color+'"></b></span><span class="v">'+fmtM(p.v)+'</span><span class="p">'+pct(totalRev?p.v/totalRev*100:null)+'</span></div>'
      +(sub?'<details class="dd"><summary>内訳</summary>'+sub+'</details>':'');
  }).join('');
  var over=totalSg-totalRev;
  return'<div class="card"><div class="ch">売上をどう使ったか<span class="r">売上＝100%</span></div>'
    +'<div class="band" style="width:'+(totalRev/base*100)+'%;background:'+CH.gold+';opacity:.35;height:8px;margin-bottom:4px" title="売上"></div>'
    +'<div class="band">'+band+'</div>'
    +'<div class="band-rows">'+rows+'</div>'
    +'<div class="row b" style="margin-top:10px;border-top:1px solid var(--line);padding-top:10px"><span class="k">販管費 合計</span><span class="v">'+fmtM(totalSg)+'</span><span class="p mut" style="font-size:11px;min-width:34px;text-align:right">'+pct(totalRev?totalSg/totalRev*100:null)+'</span></div>'
    +'<div class="row b"><span class="k">営業利益</span><span class="v '+signCls(totalOp)+'">'+fmtM(totalOp)+'</span><span class="p mut" style="font-size:11px;min-width:34px;text-align:right">'+pct(totalRev?totalOp/totalRev*100:null)+'</span></div>'
    +(over>0?'<div class="note" style="margin-top:6px">売上より販管費が '+fmtM(over)+' 多い状態です。</div>':'')
    +(known===0?'<div class="note" style="margin-top:6px">内訳は損益CSV（月次推移）を取り込むと出ます。</div>':'')
    +'</div>';
}

// 12か月表（スポーツクラブ／コインランドリー）。月を横に並べ、行ごとに比べる
function buildKpiYearTable(){
  var ms=FM.filter(function(m){return !!S.kpiData[m];});
  if(!ms.length)return'';
  function num(v,u){if(v==null||v===''||isNaN(v))return'<span class="mut">—</span>';return u==='man'?fmtM(v):u==='pct'?pct(v,1):u==='yen'?Number(Math.round(v)).toLocaleString()+'円':Number(v).toLocaleString();}
  function table(title,rows,good){
    var head='<tr><th>項目</th>'+ms.map(function(m){return'<th class="num">'+esc(m)+'</th>';}).join('')+'</tr>';
    var body=rows.map(function(r){
      var cells=ms.map(function(m,i){var v=r.get(S.kpiData[m]);var pv=i>0?r.get(S.kpiData[ms[i-1]]):null;var cl='';
        if(v!=null&&pv!=null&&!isNaN(v)&&!isNaN(pv)&&v!==pv){cl=((r.good||1)*(v-pv)>0)?'pos':'neg';}
        return'<td class="num '+cl+'">'+num(v,r.u)+'</td>';}).join('');
      return'<tr><td>'+lab(r.label)+'</td>'+cells+'</tr>';}).join('');
    return'<div class="card flush" style="margin-top:12px"><div class="ch">'+esc(title)+'<span class="r">色＝前月より良い（緑）／悪い（赤）</span></div><div class="tbl-wrap"><table class="yr"><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div></div>';
  }
  var sc=[
    {label:'月末会員数',u:'mei',get:function(k){return k.members_end;}},

function buildFinance(m,md,has){
  var note=S.finNotes[m]||{balance:null,expenses:[]};
  var html='';

    html+='<div class="card"><div class="empty"><b>'+esc(m)+'の損益データがありません</b>「データ取込」から損益CSV（月次推移）を入れ直すと表示されます。</div></div>';
  }else{
    var plTemp=note.pl_temp||{},editPl=(S.finEditPl===m);
    function getRaw(key){var d=S.raw[key];if(!d)return 0;var v=d[m];return(v!=null&&v!=='')?(+v)||0:0;}
    function getPt(key){var e=plTemp[key];if(e==null)return null;if(typeof e==='object')return e;return{v:e,confirmed:false};}
    function effVal(key){var pt=getPt(key);if(pt!=null&&pt.v!=null){if(pt.confirmed)return pt.v;var rw=getRaw(key);return rw!==0?rw:pt.v;}return getRaw(key);}
    function getStatus(key){var pt=getPt(key),raw=getRaw(key);if(pt==null)return raw!==0?'csv':'none';if(pt.confirmed)return raw!==0?'override':'confirmed';return raw!==0?'csv':'temp';}
    var sgKeys=['役員報酬','給料賃金','法定福利費','業務委託料','地代家賃','水道光熱費','備品・消耗品費','広告宣伝費','通信費'];
    var sgItemsSum=0;sgKeys.forEach(function(k){sgItemsSum+=effVal(k);});
    var sgOther=md.sg-sgItemsSum;
    var hasAdjust=sgKeys.some(function(k){return getPt(k)!=null;})||getPt('売上高')!=null||getPt('売上原価合計')!=null||getPt('売上高合計')!=null;
    function sb(st){return st==='csv'?tag('CSV','csv'):st==='override'?tag('修正','ovr'):st==='confirmed'?tag('確定','fix'):st==='temp'?tag('仮','tmp'):'';}
    // 売上高の内訳（事業ごと）：MFの部門別集計表があればそれ、無ければKPI・ランドリーExcelの値
    var bd=(S.finNotes[m]||{}).bizDept,kp=S.kpiData[m]||{},revSub=[],revSrc='';
    // KPI（現場の売上）を優先。MFの部門別は部門が付いていない売上が多く、事業ごとの実感と合わないため予備扱い
    if(kp.aqxia_sales||kp.air_sales||kp.laundry_sales){
      revSrc='KPI・ランドリーExcel';
      if(kp.aqxia_sales)revSub.push({key:'スポーツクラブ AQXIA',calc:kp.aqxia_sales});
      if(kp.air_sales)revSub.push({key:'スポーツクラブ AIR',calc:kp.air_sales});
      if(kp.laundry_sales)revSub.push({key:'コインランドリー',calc:kp.laundry_sales});
    }else if(bd&&((bd.gym||{})['売上高']||(bd.laundry||{})['売上高']||(bd.stay||{})['売上高'])){
      revSrc='部門別集計表（部門が付いていない売上は差額に入ります）';

    }
    if(revSub.length){var revKnown=revSub.reduce(function(a,x){return a+x.calc;},0);var diff=md.rev-revKnown;if(Math.abs(diff)>=1)revSub.push({key:'その他・差額',calc:diff});revSub.push({note:'出どころ：'+revSrc+'。宿泊は開業後に加わります。'});}
    else revSub.push({note:'事業ごとの売上は、KPI（PDF）・ランドリーExcel・部門別集計表のどれかを取り込むと出ます。'});

    defs.push({key:'営業利益',b:1,calc:md.op,id:'op'});
    var incK=['受取利息','受取配当金','助成金収入','助成金','補助金収入','補助金','還付金','還付加算金','為替差益','雑収入'],expK=['支払利息','雑損失','為替差損'];
    var incT=getRaw('営業外収益合計'),expT=getRaw('営業外費用合計'),si=0,se=0,extra=[];
    incK.forEach(function(k){var v=getRaw(k);if(v){extra.push({key:k,calc:v});si+=v;}});

      }

  var saved=(note.expenses||[]).filter(function(e){return e.label;});
  var expList=saved.length?saved.map(function(e){return'<div class="row">'+tag(e.type==='plan'?'予定':'実績',e.type==='plan'?'plan':'actual')+'<span class="k">'+esc(e.label)+(e.date?'<span class="mut" style="font-size:11px;margin-left:6px">'+esc(fmtDate(e.date))+'</span>':'')+'</span><span class="v">'+(e.amount?fmtM(e.amount*10000):'—')+'</span></div>';}).join('')

// マークダウン → HTML（報告書用。v24より表に対応）
function renderMd(text){
  if(!text)return'';
  function inl(s){return esc(s).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');}
  var lines=text.split('\n'),out=[],i=0;
  while(i<lines.length){
    var line=lines[i];
    var hm=/^(#{1,3})\s+(.*)$/.exec(line);
    if(hm){var lv=hm[1].length,t=hm[2].replace(/^#+\s*/,'').trim();var nm=t.match(/^([①②③④⑤⑥⑦⑧⑨⑩]|\d+[\.\)])\s*/);
      if(nm||lv===1){var no='';if(nm){no='<span class="no">'+esc(nm[1].replace(/[\.\)]/,''))+'</span>';t=t.slice(nm[0].length);}out.push('<h1>'+no+'<span>'+inl(t)+'</span></h1>');}
      else if(lv===2)out.push('<h2>'+inl(t)+'</h2>');else out.push('<h3>'+inl(t)+'</h3>');
      i++;continue;}
    if(/^\|.*\|\s*$/.test(line)){var tb=[];while(i<lines.length&&/^\|.*\|\s*$/.test(lines[i])){tb.push(lines[i]);i++;}
      var rows=tb.filter(function(r){return!/^\|\s*:?-{2,}/.test(r);}).map(function(r){return r.replace(/^\||\|\s*$/g,'').split('|').map(function(c){return c.trim();});});
      if(rows.length){var th='<tr>'+rows[0].map(function(c){return'<th>'+inl(c)+'</th>';}).join('')+'</tr>';var td=rows.slice(1).map(function(r){return'<tr>'+r.map(function(c,ci){return'<td'+(ci>0&&/^[▲\d,.\-+%円万]+$/.test(c.replace(/\*/g,''))?' class="num"':'')+'>'+inl(c)+'</td>';}).join('')+'</tr>';}).join('');
        out.push('<table><thead>'+th+'</thead><tbody>'+td+'</tbody></table>');}
      continue;}
    if(line.startsWith('- ')||line.startsWith('・')||line.startsWith('* ')){var items=[];while(i<lines.length&&(lines[i].startsWith('- ')||lines[i].startsWith('・')||lines[i].startsWith('* '))){items.push('<li><span>'+inl(lines[i].replace(/^(- |・|\* )/,'').trim())+'</span></li>');i++;}out.push('<ul>'+items.join('')+'</ul>');continue;}
    if(/^\d+\.\s/.test(line)){var ni=[];while(i<lines.length&&/^\d+\.\s/.test(lines[i])){ni.push('<li><span>'+inl(lines[i].replace(/^\d+\.\s*/,'').trim())+'</span></li>');i++;}out.push('<ol>'+ni.join('')+'</ol>');continue;}
    if(/^(---|\*\*\*|===)\s*$/.test(line.trim())){out.push('<hr>');i++;continue;}
    if(line.startsWith('> ')){var q=[];while(i<lines.length&&lines[i].startsWith('> ')){q.push(inl(lines[i].slice(2)));i++;}out.push('<blockquote>'+q.join('<br>')+'</blockquote>');continue;}
    if(!line.trim()){out.push('<div class="gap"></div>');i++;continue;}
    out.push('<p>'+inl(line)+'</p>');i++;
  }
  return out.join('');
}

function startTour(name){
  S.drawer=false;var to=document.getElementById('tour-toast');if(to)to.remove();try{localStorage.setItem('kd_tour_seen','1');}catch(e){}
  if(name==='trend'&&S.view!=='trend'){S.view='trend';}
  if(name==='month'&&S.view==='trend'){var ms=FM.filter(function(m){var d=getEffData(m);return(d.rev>0||d.sg>0)&&!isCurMonth(m);});if(!ms.length)ms=FM.filter(function(m){var d=getEffData(m);return d.rev>0||d.sg>0;});S.view=ms.length?ms[ms.length-1]:'5月';S.selMonth=S.view;}
  S.sec='finance';S.repMode='view';
  S.tour={name:name,i:0};
  render();
}
function endTour(){S.tour=null;var t=document.getElementById('tour');if(t)t.innerHTML='';document.body.classList.remove('touring');try{localStorage.setItem('kd_tour_seen','1');}catch(e){}}
function tourGo(d){
  var tr=S.tour;if(!tr)return;var steps=TOURS[tr.name].steps;var n=tr.i+d;
  if(n<0)return;if(n>=steps.length){endTour();return;}
  tr.i=n;var st=steps[n];
  if(st.sec&&S.sec!==st.sec){S.sec=st.sec;render();return;}
  if(!st.sec&&tr.name==='month'&&S.sec!=='finance'){S.sec='finance';render();return;}
  tourPlace();
}
function tourPlace(){
  var tr=S.tour,host=document.getElementById('tour');if(!tr||!host)return;
  var steps=TOURS[tr.name].steps,st=steps[tr.i];
  var el=document.querySelector(st.sel);
  if(!el){/* この画面に無い要素は飛ばす */var next=tr.i+1;if(next>=steps.length){endTour();return;}tr.i=next;var s2=steps[next];if(s2.sec&&S.sec!==s2.sec){S.sec=s2.sec;render();return;}tourPlace();return;}
  document.body.classList.add('touring');
  host.innerHTML='<div class="tour-shade" data-act="tour-end"></div><div class="tour-hi"></div>'
    +'<div class="tour-pop"><div class="tp-h"><span class="tp-n">'+(tr.i+1)+' / '+steps.length+'</span><b>'+esc(st.t)+'</b><button class="x" data-act="tour-end" title="おわる">✕</button></div>'
    +'<div class="tp-x">'+esc(st.x)+'</div>'
    +'<div class="tp-f"><span class="tp-dots">'+steps.map(function(_,k){return'<i class="'+(k===tr.i?'on':k<tr.i?'done':'')+'"></i>';}).join('')+'</span>'
    +'<span class="tp-btns">'+(tr.i>0?'<button class="btn sm" data-act="tour-prev">← 戻る</button>':'')+'<button class="btn sm pri" data-act="tour-next">'+(tr.i===steps.length-1?'おわる':'次へ →')+'</button></span></div></div>';
  var r=el.getBoundingClientRect();
  var vis=r.top>=100&&r.bottom<=window.innerHeight-40;
  if(!vis){el.scrollIntoView({block:r.height>window.innerHeight*0.6?'start':'center',behavior:'smooth'});setTimeout(tourFit,420);}
  else tourFit();
}
function tourFit(){
  var tr=S.tour;if(!tr)return;var st=TOURS[tr.name].steps[tr.i];var el=document.querySelector(st.sel);var hi=document.querySelector('.tour-hi'),pop=document.querySelector('.tour-pop');if(!el||!hi||!pop)return;
  var r=el.getBoundingClientRect(),pad=6;
  hi.style.left=(r.left-pad)+'px';hi.style.top=(r.top-pad)+'px';hi.style.width=(r.width+pad*2)+'px';hi.style.height=(r.height+pad*2)+'px';
  var narrow=window.innerWidth<700;
  if(narrow){pop.style.left='8px';pop.style.right='8px';pop.style.width='auto';pop.style.top='auto';pop.style.bottom='10px';return;}
  var pw=360;pop.style.width=pw+'px';pop.style.right='auto';pop.style.bottom='auto';
  var ph=pop.offsetHeight||160;
  var below=r.bottom+12+ph<window.innerHeight-10;
  var top=below?r.bottom+12:Math.max(10,r.top-12-ph);
  if(!below&&r.top-12-ph<10){top=Math.min(window.innerHeight-ph-10,Math.max(10,r.top+20));}
  var left=Math.min(Math.max(10,r.left),window.innerWidth-pw-10);
  pop.style.top=top+'px';pop.style.left=left+'px';
}
window.addEventListener('resize',function(){if(S.tour)tourFit();});
window.addEventListener('scroll',function(){if(S.tour)tourFit();},{passive:true});

}
function goMonth(m){S.view=m;S.selMonth=m;S.repMode='view';S.finEditPl=null;S.kpiEditMode=null;window.scrollTo(0,0);render();}

// クリックはすべて data-act で受ける（v24の「id を1つずつ拾う」方式をやめた）
function bindEvents(){
  var app=document.body;
  if(!app._bound){
    app._bound=true;
    app.addEventListener('click',function(e){
      var b=e.target.closest('[data-act]');if(!b)return;
      var act=b.dataset.act;
      if(act==='month'){var m=b.dataset.m;if(m==='trend'){S.view='trend';S.repMode='view';window.scrollTo(0,0);render();}else goMonth(m);return;}
      if(act==='jump'){S.jump=b.dataset.to;render();return;}
      if(act==='tg'){if(e.target.closest('input,select'))return;var t=b.dataset.t;S.plOpen[t]=!S.plOpen[t];S.jump=null;var y=window.scrollY;render();window.scrollTo(0,y);return;}
      if(act==='sec'){S.sec=b.dataset.v;render();var sg=document.querySelector('.seg');if(sg&&sg.getBoundingClientRect().top<110)sg.scrollIntoView({block:'start'});return;}
      if(act==='fy-prev'){if(S.fy>BASE_FY)switchYear(S.fy-1);return;}
      if(act==='fy-next'){if(S.fy<maxFY())switchYear(S.fy+1);return;}
      if(act==='login'){doLogin();return;}
      if(act==='logout'){if(confirm('この端末からログアウトしますか？'))logout();return;}
      if(act==='drawer'){S.drawer=true;render();return;}
      if(act==='guide'){S.drawer='guide';render();return;}
      if(act==='tour-start'){var tn=b.dataset.name||(S.view==='trend'?'trend':'month');var to=document.getElementById('tour-toast');if(to)to.remove();try{localStorage.setItem('kd_tour_seen','1');}catch(e){}startTour(tn);return;}
      if(act==='toast-close'){var to2=document.getElementById('tour-toast');if(to2)to2.remove();try{localStorage.setItem('kd_tour_seen','1');}catch(e){}return;}
      if(act==='tour-next'){tourGo(1);return;}
      if(act==='tour-prev'){tourGo(-1);return;}
      if(act==='tour-end'){endTour();return;}
      if(act==='print-kpi'){document.body.classList.add('print-kpi');setTimeout(function(){window.print();setTimeout(function(){document.body.classList.remove('print-kpi');},500);},50);return;}
      if(act==='drawer-close'){S.drawer=false;render();return;}
      if(act==='file'){var inp=document.getElementById(b.dataset.for);if(inp)inp.click();return;}
      if(act==='sync'){loadGas();return;}
      if(act==='bizmetric'){S.bizMetric=b.dataset.v;S.jump='dept';render();return;}
      if(act==='kpi-file'){S.drawer=true;render();setTimeout(function(){var k=document.getElementById('kpi-input');if(k)k.click();},50);return;}
      if(act==='laundry-file'){S.drawer=true;render();setTimeout(function(){var k=document.getElementById('laundry-xlsx');if(k)k.click();},50);return;}
      // 損益の手入力
      if(act==='pl-edit'){S.finEditPl=S.selMonth;S.jump='finance';render();return;}
      if(act==='pl-cancel'){S.finEditPl=null;S.jump='finance';render();return;}
      if(act==='pl-save'){savePlTemp();return;}
      if(act==='bal-save'){var inp2=document.getElementById('bal-input');var note=Object.assign({},S.finNotes[S.selMonth]||{});if(inp2){var v=inp2.value.trim();note.balance=v!==''?parseFloat(v):null;}
        S.finNotes=Object.assign({},S.finNotes);S.finNotes[S.selMonth]=note;gasPost({action:'save_finance_notes',data:allFinNotes()});S.jump='finance';render();return;}
      if(act==='exp-add'){var n2=Object.assign({},S.finNotes[S.selMonth]||{});n2.expenses=(n2.expenses||[]).concat([{label:'',amount:'',date:'',type:'plan'}]);S.finNotes=Object.assign({},S.finNotes);S.finNotes[S.selMonth]=n2;S.jump='finance';render();
        setTimeout(function(){var d=document.querySelector('#finance details.dd');if(d)d.open=true;},40);return;}
      if(act==='exp-save'){saveExpenses();return;}
      if(b.classList.contains('btn-del-expense')){var idx=parseInt(b.dataset.ei);var n3=Object.assign({},S.finNotes[S.selMonth]||{});var ex=(n3.expenses||[]).slice();ex.splice(idx,1);n3.expenses=ex;S.finNotes=Object.assign({},S.finNotes);S.finNotes[S.selMonth]=n3;gasPost({action:'save_finance_notes',data:allFinNotes()});S.jump='finance';render();return;}
      // KPI
      if(act==='kpi-edit'){S.kpiEditMode=S.selMonth;S.jump='kpi';render();return;}
      if(act==='kpi-cancel'){S.kpiEditMode=null;S.jump='kpi';render();return;}
      if(act==='kpi-save'){saveKpi();return;}
      // 報告書
      if(act==='rep-create'){S.repMode='create';S.genResult='';if(S.formAnswers&&S.formAnswers[S.selMonth])S.iAns=Object.assign({},S.formAnswers[S.selMonth]);else S.iAns={};S.jump='report';render();return;}
      if(act==='rep-upload'){S.repMode='upload';S.jump='report';render();return;}
      if(act==='rep-close'){S.repMode='view';S.jump='report';render();return;}
      if(act==='rep-delete'){if(!confirm('「'+S.selMonth+'」の報告書を削除しますか？この操作は取り消せません。'))return;S.reports=Object.assign({},S.reports);delete S.reports[S.selMonth];S.repMode='view';gasPost({action:'delete_report',month:gkey(S.fy,S.selMonth)});S.jump='report';render();return;}
      if(act==='rep-edit'){var rep=S.reports[S.selMonth]||{};S.draft=rep.text||'';S.iAns={};S.repMode='edit';S.jump='report';
        if(S.formAnswers&&S.formAnswers[S.selMonth]){S.iAns=Object.assign({},S.formAnswers[S.selMonth]);render();}
        else{render();fetch(S.gasUrl,{method:'POST',body:JSON.stringify(withAuth({action:'read_ians'}))}).then(function(r){return r.json();}).then(function(j){if(j&&j.ok&&j.formAnswers){mergeFormAnswers(j.formAnswers);if(S.formAnswers[S.selMonth]){S.iAns=Object.assign({},S.formAnswers[S.selMonth]);render();}}}).catch(function(){});}
        return;}
      if(act==='rep-submit'){submitForm();return;}
      if(act==='rep-save-gen'){var d={text:S.genResult,savedAt:new Date().toLocaleDateString('ja-JP'),iAns:S.iAns};S.reports=Object.assign({},S.reports);S.reports[S.selMonth]=d;gasPost({action:'save_report',month:gkey(S.fy,S.selMonth),data:d});S.repMode='view';S.jump='report';render();return;}
      if(act==='rep-save-edit'){var ta=document.getElementById('draft-area');if(!ta)return;document.querySelectorAll('.edit-ans-inp').forEach(function(el){if(el.dataset.key)S.iAns[el.dataset.key]=el.value;});
        S.formAnswers=Object.assign({},S.formAnswers);S.formAnswers[S.selMonth]=S.iAns;gasPost({action:'save_ians',month:gkey(S.fy,S.selMonth),data:S.iAns});
        var d2={text:ta.value,savedAt:new Date().toLocaleDateString('ja-JP'),iAns:S.iAns};S.reports=Object.assign({},S.reports);S.reports[S.selMonth]=d2;gasPost({action:'save_report',month:gkey(S.fy,S.selMonth),data:d2});S.repMode='view';S.jump='report';render();return;}
    });
    // 引き出しの外側を押したら閉じる
    document.getElementById('shade').addEventListener('click',function(){S.drawer=false;render();});
    // ツールチップ
    var tip=document.getElementById('tip');
    app.addEventListener('mouseover',function(e){var t=e.target.closest('[data-tip]');if(!t||!t.dataset.tip){tip.classList.remove('on');return;}tip.textContent=t.dataset.tip;tip.classList.add('on');});
    app.addEventListener('mousemove',function(e){if(!tip.classList.contains('on'))return;var x=e.clientX+14,y=e.clientY+14;if(x+tip.offsetWidth>window.innerWidth-8)x=e.clientX-tip.offsetWidth-10;if(y+tip.offsetHeight>window.innerHeight-8)y=e.clientY-tip.offsetHeight-10;tip.style.left=x+'px';tip.style.top=y+'px';});
    app.addEventListener('mouseout',function(e){if(e.target.closest('[data-tip]'))tip.classList.remove('on');});
    app.addEventListener('click',function(e){var t=e.target.closest('.term');if(!t){if(tip._tap){tip.classList.remove('on');tip._tap=false;}return;}
      e.stopPropagation();var r=t.getBoundingClientRect();tip.textContent=t.dataset.tip;tip.classList.add('on');tip._tap=true;
      var x=Math.min(r.left,window.innerWidth-tip.offsetWidth-8),y=r.bottom+6;if(y+tip.offsetHeight>window.innerHeight-8)y=r.top-tip.offsetHeight-6;tip.style.left=Math.max(8,x)+'px';tip.style.top=y+'px';},true);
    document.addEventListener('keydown',function(e){if(e.key==='Enter'&&!S.auth&&e.target&&/lg-/.test(e.target.id||'')){doLogin();return;}if(e.key==='Escape'){if(S.tour){endTour();return;}if(S.drawer){S.drawer=false;render();}}if(S.tour&&(e.key==='ArrowRight'||e.key==='Enter'))tourGo(1);if(S.tour&&e.key==='ArrowLeft')tourGo(-1);});
  }
  // ファイル入力（描画のたびに作り直されるので毎回つなぐ）
  function onFile(id,fn){var el=document.getElementById(id);if(el)el.addEventListener('change',function(e){if(e.target.files&&e.target.files[0]){S.drawer=false;fn(e.target.files[0]);}});}

function savePlTemp(){
  var note=Object.assign({},S.finNotes[S.selMonth]||{});var pt=Object.assign({},note.pl_temp||{});var selMap={};
  document.querySelectorAll('.pl-status-sel').forEach(function(s){selMap[s.dataset.key]=s.value;});
  document.querySelectorAll('.pl-temp-inp').forEach(function(inp){var key=inp.dataset.key,v=inp.value.trim();if(v===''){pt[key]=null;return;}var num=parseFloat(v);if(isNaN(num)){pt[key]=null;return;}
    var d=S.raw[key];var raw=(d&&d[S.selMonth]!=null&&d[S.selMonth]!=='')?(+d[S.selMonth])||0:0;if(num===raw){pt[key]=null;}else{pt[key]={v:num,confirmed:selMap[key]==='confirmed'};}});
  note.pl_temp=pt;S.finNotes=Object.assign({},S.finNotes);S.finNotes[S.selMonth]=note;gasPost({action:'save_finance_notes',data:allFinNotes()});S.finEditPl=null;S.jump='finance';render();
}
function saveExpenses(){
  var types=[].slice.call(document.querySelectorAll('.exp-type')),labels=[].slice.call(document.querySelectorAll('.exp-label')),amounts=[].slice.call(document.querySelectorAll('.exp-amount')),dates=[].slice.call(document.querySelectorAll('.exp-date'));
  var note=Object.assign({},S.finNotes[S.selMonth]||{});
  note.expenses=labels.map(function(_,i){return{type:types[i]?types[i].value:'plan',label:labels[i]?labels[i].value.trim():'',amount:amounts[i]&&amounts[i].value.trim()?parseFloat(amounts[i].value):null,date:dates[i]?dates[i].value:''};}).filter(function(e){return e.label;});
  S.finNotes=Object.assign({},S.finNotes);S.finNotes[S.selMonth]=note;gasPost({action:'save_finance_notes',data:allFinNotes()});S.jump='finance';render();
}
function saveKpi(){
  var kpi=Object.assign({},S.kpiData[S.selMonth]||{});
  document.querySelectorAll('.kpi-field').forEach(function(inp){var key=inp.dataset.key,raw=inp.value.trim();if(raw===''){kpi[key]=null;return;}var f=null;for(var i=0;i<KPI_FIELDS.length;i++){if(KPI_FIELDS[i][0]===key){f=KPI_FIELDS[i];break;}}var unit=f?f[2]:'';kpi[key]=(unit==='str')?raw:parseFloat(raw.replace(/,/g,''))||null;});
  S.kpiData=Object.assign({},S.kpiData);S.kpiData[S.selMonth]=kpi;gasPost({action:'save_kpi',month:gkey(S.fy,S.selMonth),data:kpi});S.kpiEditMode=null;S.jump='kpi';render();
}

loadAuth();
render();
if(S.gasConnected&&S.auth)loadGas();

</script>
