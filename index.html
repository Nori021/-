var BASE_FY=2025; // 既存クラウドデータ（接頭辞なし）＝2025年度として扱うfunction curFY(){var d=new Date(),y=d.getFullYear(),m=d.getMonth()+1;return m>=5?y:y-1;}
function fyLabel(fy){return fy+'年度';}
function fyRange(fy){return fy+'年5月〜'+(fy+1)+'年4月';}
// GAS保存キーの接頭辞（2025年度は接頭辞なし＝既存データ互換）
function pfx(fy){return fy===BASE_FY?'':('FY'+fy+'_');}
function gkey(fy,m){return pfx(fy)+m;}
function parseGkey(k){var mm=/^FY(\d{4})_([\s\S]+)$/.exec(k);return mm?{fy:+mm[1],m:mm[2]}:{fy:BASE_FY,m:k};}
// CSV等の単一スロット保存に年度タグを付けて、再読込時に正しい年度へ復元する
function tagName(fy,name){return '[FY'+fy+'] '+(name||'');}
function parseName(s){var mm=/^\[FY(\d{4})\]\s*([\s\S]*)$/.exec(s||'');return mm?{fy:+mm[1],name:mm[2]}:{fy:null,name:s};}

function yearDefaults(){return{kpiData:{},reports:{},finNotes:{},formAnswers:{},csv:'',csvName:'CSVをアップロードしてください',raw:{},bsData:{},bsName:'残高試算表をアップロード',bizCsv:null,bizCsvName:'部門別CSVをアップロード'};}
function ensureYear(fy){if(!S.years[fy])S.years[fy]=yearDefaults();return S.years[fy];}
function stashActive(){var b=ensureYear(S.fy);YEAR_FIELDS.forEach(function(f){b[f]=S[f];});}
function activateYear(fy){var b=ensureYear(fy);S.fy=fy;YEAR_FIELDS.forEach(function(f){S[f]=b[f];});}

// 全年度の財務メモを1つのオブジェクトに統合（GASは1スロット保存のため）
function allFinNotes(){stashActive();var out={};Object.keys(S.years).forEach(function(fy){var fn=S.years[fy].finNotes||{};Object.keys(fn).forEach(function(m){out[gkey(+fy,m)]=fn[m];});});return out;}

function fmtM(v){if(v==null||v===''||isNaN(v))return'—';var n=Math.round(v/10000);return(v<0?'▲':'')+Math.abs(n).toLocaleString()+'万';}
function fmtY(v){if(v==null||v==='')return'—';return(v<0?'▲':'')+Math.abs(Math.round(v)).toLocaleString()+'円';}
function fmtN(v,u){return(v==null||v==='')?(u?'—':'—'):Number(v).toLocaleString()+(u||'');}
function fmtKpi(v,unit){
  if(v==null||v==='')return'—';
  if(unit==='man')return fmtM(v);
  if(unit==='yen')return fmtY(v);
  if(unit==='pct')return v+'%';
  if(unit==='mei')return Number(v).toLocaleString()+'名';
  if(unit==='num')return Number(v).toLocaleString()+'件';
  return String(v);
}
function colV(v){return v>0?C.green:v<0?C.red:C.textX;}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function csvSplit(line){
  var r=[],cur='',inQ=false;
  for(var i=0;i<line.length;i++){var c=line[i];if(c==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++;}else{inQ=!inQ;}}else if(c===','&&!inQ){r.push(cur.trim());cur='';}else{cur+=c;}}
  r.push(cur.trim());return r;
}
// CSVの月見出しを正規化（"2026年5月"/"05月"/"2026/05"/"5月" → "5月"）
function csvMonthLabel(s){
  if(s==null)return null;
  s=String(s).trim();
  var m=/(?:\d{2,4}\s*年\s*)?0*(\d{1,2})\s*月/.exec(s);
  if(!m){var m2=/^\d{4}\s*[\/\-\.]\s*0*(\d{1,2})(?:\s*[\/\-\.]\s*\d{1,2})?$/.exec(s);if(m2)m=m2;}
  if(!m)return null;
  var n=parseInt(m[1],10);
  return(n>=1&&n<=12)?(n+'月'):null;
}
function parseCSV(text){
  if(!text||!text.trim())return{};
  var lines=text.split(/\r?\n/).filter(function(l){return l.trim();});
  // ヘッダー行＝月ラベルが最も多く並ぶ行を採用（年付き表記にも対応）
  var hdrLine=null,bestCount=0;
  for(var i=0;i<lines.length;i++){
    var cells=csvSplit(lines[i]),c=0;
    for(var k=0;k<cells.length;k++){if(csvMonthLabel(cells[k]))c++;}
    if(c>bestCount){bestCount=c;hdrLine=lines[i];}
  }
  if(!hdrLine||bestCount<1)return{};
  var hdr=csvSplit(hdrLine),midx={};
  for(var i=0;i<hdr.length;i++){var lbl=csvMonthLabel(hdr[i]);if(lbl&&FM.indexOf(lbl)>=0&&midx[lbl]==null)midx[lbl]=i;}
  if(!Object.keys(midx).length)return{};
  var data={};
  lines.forEach(function(line){
    var cs=csvSplit(line);
    var label=(cs[0]===''&&cs.length>1&&cs[1])?cs[1]:cs[0];
    if(!label)return;
    var vals={};
    FM.forEach(function(m){var i=midx[m];if(i==null||i>=cs.length){vals[m]=0;return;}var raw=cs[i].replace(/,/g,'');vals[m]=(raw!==''&&!isNaN(parseInt(raw)))?parseInt(raw):0;});
    if(Object.values(vals).some(function(v){return v!==0;})&&!data[label])data[label]=vals;
  });
  return data;
}

// ── 損益CSV：自動判定（月次推移 or 残高試算表/期間合計） ──────
function parsePL(text){
  var trend=parseCSV(text);
  if(Object.keys(trend).length>0)return{raw:trend,mode:'trend',month:null};
  var bal=parsePlBalance(text);
  if(bal&&Object.keys(bal.raw).length>0)return bal;
  return{raw:{},mode:'none',month:null};
}
// 残高試算表形式の損益計算書（月の列が無く、期間合計が1列）を取り込む
function parsePlBalance(text){
  if(!text||!text.trim())return null;
  var lines=text.split(/\r?\n/).filter(function(l){return l.trim();});
  var hi=-1;
  for(var i=0;i<lines.length;i++){if(lines[i].indexOf('勘定科目')>=0&&(lines[i].indexOf('終了月')>=0||lines[i].indexOf('期間')>=0)){hi=i;break;}}
  if(hi<0)return null;
  var hdr=csvSplit(lines[hi]);
  // 金額列：まず「終了月」を含む列、無ければ「期間貸方/借方」より後ろの数値列
  var valIdx=-1;
  for(var c=0;c<hdr.length;c++){if(String(hdr[c]).indexOf('終了月')>=0){valIdx=c;break;}}
  if(valIdx<0)for(var c=hdr.length-1;c>=0;c--){if(/借方|貸方|金額|残高/.test(String(hdr[c]))){valIdx=c;break;}}
  if(valIdx<0)return null;
  // 対象月：開始月の日付から（例 開始月:2026-05-01 → 5月）
  var month=null;
  var dm=/開始月[^0-9]*(\d{4})[^0-9](\d{1,2})/.exec(lines[hi]);
  if(dm){var n=parseInt(dm[2],10);if(n>=1&&n<=12)month=n+'月';}
  if(!month){var any=/(\d{4})[-\/.年](\d{1,2})/.exec(lines[hi]);if(any){var n2=parseInt(any[2],10);if(n2>=1&&n2<=12)month=n2+'月';}}
  if(!month)month='5月';
  var raw={};
  for(var i=hi+1;i<lines.length;i++){
    var cs=csvSplit(lines[i]);
    var label=(cs[0]&&cs[0]!=='')?cs[0]:(cs[1]||'');
    if(!label)continue;
    var rv=(cs[valIdx]!=null?cs[valIdx]:'').replace(/[,円"]/g,'').replace(/%$/,'');
    var v=parseFloat(rv);if(isNaN(v))v=0;
    if(v!==0&&!raw[label]){raw[label]={};FM.forEach(function(m){raw[label][m]=0;});raw[label][month]=v;}
  }
  return{raw:raw,mode:'balance',month:month};
}
// 列: 勘定科目, 補助科目, スポーツクラブ部門, 宿泊施設部門, コインランドリー, 共通費, 合計
function parseBizCSV(text){
  if(!text||!text.trim())return null;
  var lines=text.split(/\r?\n/).filter(function(l){return l.trim();});
  // ヘッダー行を探す（"スポーツクラブ"を含む行）
  var hdr=null,hIdx=-1;
  for(var i=0;i<lines.length;i++){
    if(lines[i].indexOf('スポーツクラブ')>=0){hdr=csvSplit(lines[i]);hIdx=i;break;}
  }
  if(!hdr)return null;
  // 列インデックスを取得
  function ci(keyword){for(var j=0;j<hdr.length;j++){if(hdr[j].indexOf(keyword)>=0)return j;}return -1;}
  var cols={
    label:0, sub:1,
    gym: ci('スポーツクラブ'),
    stay: ci('宿泊'),
    laundry: ci('コインランドリー'),
    common: ci('共通費'),
    total: ci('合計'),
  };
  // 結果オブジェクト
  var result={gym:{},stay:{},laundry:{},common:{},total:{}};
  var currentSection='';
  for(var i=hIdx+1;i<lines.length;i++){
    var cs=csvSplit(lines[i]);
    if(!cs.length)continue;
    var label=cs[0]?cs[0].trim():'';
    var sub=cs[1]?cs[1].trim():'';
    // セクション見出し（勘定科目のみ、補助科目なし、数値なし）
    if(label&&!sub){
      currentSection=label;
      // 合計行は数値を拾う
      if(label.indexOf('合計')>=0||label==='営業利益'||label==='経常利益'||label==='当期純利益'||label==='税引前当期純利益'){
        var key=label;
        ['gym','stay','laundry','common','total'].forEach(function(bk){
          var idx=cols[bk];if(idx<0||idx>=cs.length)return;
          var raw=(cs[idx]||'').replace(/,/g,'');
          if(raw!==''&&!isNaN(parseInt(raw)))result[bk][key]=parseInt(raw);
        });
      }
      continue;
    }
    // 補助科目がある場合 → 補助科目名で記録
    // 補助科目がない場合 → 勘定科目名で記録
    var key=sub||label;
    if(!key)continue;
    ['gym','stay','laundry','common','total'].forEach(function(bk){
      var idx=cols[bk];if(idx<0||idx>=cs.length)return;
      var raw=(cs[idx]||'').replace(/,/g,'');
      if(raw!==''&&!isNaN(parseInt(raw))){
        var v=parseInt(raw);
        // 同名キーは加算（補助科目なし + 補助科目あり の重複対策）
        result[bk][key]=(result[bk][key]||0)+v;
      }
    });
  }
  return result;
}
function getMonthData(m){
  function g(k){var d=S.raw[k];if(!d)return 0;var v=d[m];return(v!=null&&v!=='')?Number(v):0;}
  return{month:m,rev:g('売上高'),op:g('営業利益'),net:g('当期純利益'),sg:g('販売費及び一般管理費合計'),eco:g('経常利益')};
}
// 手入力修正（finNotes[m].pl_temp）を反映した実効値。月別財務タブと同じロジックで全体ビューにも使う
var EFF_SG_KEYS=['役員報酬','給料賃金','法定福利費','業務委託料','地代家賃','水道光熱費','備品・消耗品費','広告宣伝費','通信費'];
function getEffData(m){
  var md=getMonthData(m);
  var note=S.finNotes[m]||{},pt=note.pl_temp||{};
  function gRaw(key){var d=S.raw[key];if(!d)return 0;var v=d[m];return(v!=null&&v!=='')?(+v)||0:0;}
  function gPt(key){var e=pt[key];if(e==null)return null;if(typeof e==='object')return e;return{v:e,confirmed:false};}
  function eff(key){var p=gPt(key);return(p!=null&&p.v!=null)?p.v:gRaw(key);}
  var calcSg=0;EFF_SG_KEYS.forEach(function(k){calcSg+=eff(k);});
  var hasAnyItem=EFF_SG_KEYS.some(function(k){return eff(k)!==0;});
  var effSg=hasAnyItem?calcSg:md.sg;
  var effRev=eff('売上高')||md.rev;
  var effOp=md.op!==0?md.op+(effSg-md.sg)*-1+(effRev-md.rev):effRev-effSg;
  var effEco=md.eco!==0?md.eco+(effSg-md.sg)*-1+(effRev-md.rev):effOp;
  var effNet=effEco+(md.net-md.eco);
  return{month:m,rev:effRev,op:effOp,net:effNet,sg:effSg,eco:effEco};
}

    +(sub?'<div style="font-size:10px;color:'+C.textX+';margin-top:3px">'+esc(sub)+'</div>':'')
    +'</div>';

function renderMd(text){
  if(!text)return'';

  // インラインスタイル: **太字** と `コード`
  function inlineStyle(s){
    return s
      .replace(/\*\*([^*]+)\*\*/g,'<strong style="font-weight:800;color:'+C.text+'">$1</strong>')
      .replace(/`([^`]+)`/g,'<code style="background:'+C.surf+';border:1px solid '+C.border+';border-radius:4px;padding:1px 5px;font-size:12px">$1</code>');
  }

  var lines=text.split('\n');
  var out=[];
  var i=0;

  while(i<lines.length){
    var line=lines[i];

    // ─ H1: # → セクション見出し（番号バッジ付き）
    if(line.startsWith('# ')){
      var title=line.slice(2).trim();
      // 先頭の①②...や数字を抽出
      var numM=title.match(/^([①②③④⑤⑥⑦⑧⑨⑩\d]+[\.\s]?)\s*/);
      var badge2='',rest=title;
      if(numM){badge2='<span style="display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:6px;background:linear-gradient(135deg,'+C.teal+','+C.blue+');color:white;font-size:11px;font-weight:800;flex-shrink:0;margin-right:9px">'+esc(numM[1].trim())+'</span>';rest=title.slice(numM[0].length);}
      out.push('<div style="display:flex;align-items:center;border-bottom:2px solid '+C.tealL+';padding-bottom:10px;margin:28px 0 14px">'+badge2+'<span style="font-size:15px;font-weight:800;color:'+C.text+'">'+inlineStyle(esc(rest))+'</span></div>');
      i++;continue;
    }

    // ─ H2: ## → サブ見出し
    if(line.startsWith('## ')){
      out.push('<div style="font-size:13px;font-weight:800;color:'+C.teal+';margin:18px 0 8px;padding-left:10px;border-left:3px solid '+C.teal+'">'+inlineStyle(esc(line.slice(3).trim()))+'</div>');
      i++;continue;
    }

    // ─ H3: ### → 小見出し
    if(line.startsWith('### ')){
      out.push('<div style="font-size:12px;font-weight:700;color:'+C.textM+';margin:14px 0 6px;text-decoration:underline;text-underline-offset:3px">'+inlineStyle(esc(line.slice(4).trim()))+'</div>');
      i++;continue;
    }

    // ─ 箇条書きブロック（連続する - をまとめてulに）
    if(line.startsWith('- ')||line.startsWith('・')){
      var items=[];
      while(i<lines.length&&(lines[i].startsWith('- ')||lines[i].startsWith('・'))){
        var itemText=lines[i].startsWith('- ')?lines[i].slice(2):lines[i].slice(1);
        items.push('<li style="margin:5px 0;line-height:1.75;font-size:13px;color:'+C.textM+'">'+inlineStyle(esc(itemText.trim()))+'</li>');
        i++;
      }
      out.push('<ul style="margin:6px 0 10px 0;padding-left:20px;list-style:none">'+items.map(function(li){return li.replace('<li ','<li style="position:relative" ').replace('<li style="position:relative" ','<li style="position:relative;margin:5px 0;line-height:1.75;font-size:13px;color:'+C.textM+'" ');}).join('')+'</ul>');
      // シンプルにそのままulで出す
      out[out.length-1]='<ul style="margin:6px 0 10px 0;padding:0;list-style:none">'+items.map(function(li){
        return li.replace('style="margin:5px 0;line-height:1.75;font-size:13px;color:'+C.textM+'"',
          'style="display:flex;align-items:flex-start;gap:8px;margin:5px 0;line-height:1.75;font-size:13px;color:'+C.textM+'"')
          .replace('<li ','<li ').replace(/>([^<])/,'><span style="color:'+C.teal+';font-weight:900;margin-top:1px;flex-shrink:0">▸</span><span>$1')+'</span></li>'.replace(/<\/li>$/,'');
      }).join('')+'</ul>';
      continue;
    }

    // ─ 数字付きリスト: 1. 2.
    if(/^\d+\.\s/.test(line)){
      var numItems=[];
      var n=1;
      while(i<lines.length&&/^\d+\.\s/.test(lines[i])){
        var ntext=lines[i].replace(/^\d+\.\s*/,'');
        numItems.push('<li style="display:flex;align-items:flex-start;gap:10px;margin:7px 0;font-size:13px;line-height:1.75;color:'+C.textM+'">'
          +'<span style="display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;border-radius:50%;background:'+C.teal+';color:white;font-size:10px;font-weight:800;flex-shrink:0;margin-top:2px">'+n+'</span>'
          +'<span>'+inlineStyle(esc(ntext.trim()))+'</span></li>');
        n++;i++;
      }
      out.push('<ol style="margin:6px 0 10px 0;padding:0;list-style:none">'+numItems.join('')+'</ol>');
      continue;
    }

    // ─ 区切り線
    if(line.trim()==='---'||line.trim()==='***'||line.trim()==='==='){
      out.push('<hr style="border:none;border-top:1px solid '+C.border+';margin:20px 0"/>');
      i++;continue;
    }

    // ─ ハイライトブロック > で始まる行
    if(line.startsWith('> ')){
      var qlines=[];
      while(i<lines.length&&lines[i].startsWith('> ')){qlines.push(lines[i].slice(2));i++;}
      out.push('<div style="margin:10px 0;padding:12px 16px;background:'+C.tealL+';border-left:4px solid '+C.teal+';border-radius:0 10px 10px 0">'
        +'<div style="font-size:13px;line-height:1.8;color:'+C.textM+'">'+qlines.map(function(l){return inlineStyle(esc(l));}).join('<br>')+'</div></div>');
      continue;
    }

    // ─ 空行
    if(!line.trim()){out.push('<div style="height:6px"></div>');i++;continue;}

    // ─ 通常テキスト
    out.push('<p style="margin:5px 0;line-height:1.85;font-size:13px;color:'+C.textM+'">'+inlineStyle(esc(line))+'</p>');
    i++;
  }
  return out.join('');
}

function buildTrend(){
  var allD=FM.map(getEffData);
  var active=allD.filter(function(d){return d.rev>0||d.sg>0;});
  if(!active.length){
    return card('<div style="text-align:center;padding:48px 20px"><div style="font-size:48px;margin-bottom:16px">📂</div><div style="font-size:16px;font-weight:700;color:'+C.textM+';margin-bottom:8px">損益データがありません</div><div style="font-size:13px;color:'+C.textS+';margin-bottom:24px">ヘッダーの「損益CSV」からアップロードしてください</div>'+btnP('btn-open-csv','📂 CSVをアップロード','padding:11px 26px;font-size:14px')+'</div>');
  }
  var totalRev=active.reduce(function(s,d){return s+d.rev;},0);
  var totalNet=active.reduce(function(s,d){return s+d.net;},0);
  var totalOp=active.reduce(function(s,d){return s+d.op;},0);
  // 粗利 = 売上高合計（原価なし）
  var totalGp=totalRev;
  // 人件費合計
  var totalJinken=['役員報酬','給料賃金','法定福利費','福利厚生費','研修採用費'].reduce(function(s,k){
    var d=S.raw[k];if(!d)return s;
    return s+active.reduce(function(ss,dd){var v=d[dd.month];return ss+((v!=null&&v!=='')?+v:0);},0);
  },0);
  var totalSg=active.reduce(function(s,d){return s+d.sg;},0);
  var last=active[active.length-1];
  var avgSg=active.length?Math.round(totalSg/active.length):0;
  var balMonths=FM.filter(function(m){return S.finNotes[m]&&S.finNotes[m].balance!=null;});
  var lastBalM=balMonths.length?balMonths[balMonths.length-1]:null;
  var lastBal=lastBalM!=null?S.finNotes[lastBalM].balance:null;
  var remainM=(lastBal!=null&&avgSg)?Math.floor(lastBal/avgSg):null;
  var memMs=active.filter(function(d){return S.kpiData[d.month]&&S.kpiData[d.month].members_end;});
  var lastKpi=memMs.length?S.kpiData[memMs[memMs.length-1].month]:{};
  var allExp=[];
  FM.forEach(function(m){var n=S.finNotes[m]||{};(n.expenses||[]).filter(function(e){return e.label;}).forEach(function(e){allExp.push(Object.assign({month:m},e));});});

  // ── 月次損益グラフ ──────────────────────────────────────
  var maxRev=Math.max.apply(null,active.map(function(d){return Math.max(d.rev,d.sg);}));if(maxRev<=0)maxRev=1;
  var GH=140;
  var bars=active.map(function(d){
    var note=S.finNotes[d.month]||{};
    var hasExp=(note.expenses||[]).some(function(e){return e.label;});
    var rh=Math.max(4,Math.round(d.rev/maxRev*GH)),sh=Math.max(4,Math.round(d.sg/maxRev*GH));
    var netPos=d.net>=0,netColor=netPos?C.green:C.red;
    var mo=d.month.replace(/\d{4}年/,'').replace('月','');
    return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;min-width:36px;cursor:default">'
      +(d===last?'<div style="font-size:9px;color:'+C.teal+';font-weight:700;margin-bottom:2px">'+Math.round(d.rev/10000)+'万</div>':'<div style="height:15px"></div>')
      +'<div style="width:100%;height:'+GH+'px;display:flex;align-items:flex-end;justify-content:center;gap:2px;position:relative">'
      +'<div style="width:42%;height:'+rh+'px;background:'+C.teal+';border-radius:4px 4px 0 0;position:relative">'
        +(rh>28?'<div style="position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:8px;color:white;font-weight:700">'+Math.round(d.rev/10000)+'</div>':'')
      +'</div>'
      +'<div style="width:42%;height:'+sh+'px;background:'+C.amber+';border-radius:4px 4px 0 0;position:relative">'
        +(sh>28?'<div style="position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:8px;color:white;font-weight:700">'+Math.round(d.sg/10000)+'</div>':'')
      +'</div>'
      +(hasExp?'<div style="position:absolute;top:2px;right:2px;font-size:10px">⚠️</div>':'')
      +'</div>'
      +'<div style="width:100%;display:flex;justify-content:center;align-items:center;padding:3px 0;border-top:2px solid '+C.border+';border-bottom:1px dashed '+C.border+'">'
        +'<span style="font-size:9px;font-weight:800;color:'+netColor+'">'+(netPos?'▲':'▼')+Math.round(Math.abs(d.net)/10000)+'</span>'
      +'</div>'
      +'<div style="font-size:10px;color:'+C.textS+';margin-top:4px;font-weight:600">'+mo+'月</div>'
      +'</div>';
  }).join('');
  var mainChart=slabel('📊','月次グラフ（万円）')
    +'<div style="display:flex;gap:10px;margin-bottom:10px">'
      +'<span style="display:flex;align-items:center;gap:4px;font-size:11px;color:'+C.textM+'"><span style="display:inline-block;width:12px;height:12px;background:'+C.teal+';border-radius:2px"></span>売上</span>'
      +'<span style="display:flex;align-items:center;gap:4px;font-size:11px;color:'+C.textM+'"><span style="display:inline-block;width:12px;height:12px;background:'+C.amber+';border-radius:2px"></span>販管費</span>'
      +'<span style="display:flex;align-items:center;gap:4px;font-size:11px;color:'+C.textM+'"><span style="font-size:10px;font-weight:800;color:'+C.green+'">▲</span>/<span style="font-size:10px;font-weight:800;color:'+C.red+'">▼</span>純利益</span>'
    +'</div>'
    +'<div style="display:flex;align-items:flex-end;gap:3px;padding:4px 0 0">'+bars+'</div>';

  // ── 残高グラフ（直近6ヶ月）──────────────────────────────
  var balDataAll=FM.map(function(m){return{month:m,bal:S.finNotes[m]&&S.finNotes[m].balance!=null?S.finNotes[m].balance:null};}).filter(function(d){return d.bal!=null;});
  var balData=balDataAll.length>6?balDataAll.slice(-6):balDataAll;
  var balChart='';
  if(balData.length>=1){
    var maxBal=Math.max.apply(null,balData.map(function(d){return Math.abs(d.bal);}));if(maxBal<=0)maxBal=1;

    +'<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px">'
    +kTile('直近残高',lastBal!=null?fmtM(lastBal):'—',lastBal!=null?(lastBal>=0?C.blue:C.red):C.textX,lastBalM?lastBalM+'末時点':'各月に手入力')
    +kTile('残存月数',remainM!=null?(remainM+'ヶ月'):'—',remColor,remainM!=null?(remainM>=6?'安全圏':remainM>=3?'要注意':'⚠️ 危険水域'):'残高入力後に計算')
    +kTile('大型支出 計画中',allExp.filter(function(e){return e.type==='plan';}).length+'件',C.purple)
    +kTile('大型支出 実績',allExp.filter(function(e){return e.type==='actual';}).length+'件',C.orange)
    +'</div>'
    +'<div style="margin-bottom:14px">'
      +tabBar
      +(tTab==='pl'
        ?card(mainChart)+(balChart||salesChart?'<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px">'+(balChart?card(balChart):'')+(salesChart?card(salesChart):'<div></div>')+'</div>':'')
        :tTab==='kpi'?kpiCharts
        :tTab==='block'?buildBlockPuzzle(active,totalRev,totalSg)
        :tTab==='biz'?buildBusiness()
        :tTab==='bs'?buildBsTab()
        :kpiCharts)
    +'</div>'
    +expHtml
    +cardNP(slabel('📋','月次損益サマリー（クリックで詳細へ）')
      +'<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12.5px;min-width:700px">'
      +'<thead><tr style="background:'+C.surf+';border-bottom:1px solid '+C.border+'">'
      +['月','売上','販管費','営業利益','経常利益','純利益','残高','KPI','報告書'].map(function(h){
        return '<th style="padding:8px 12px;text-align:'+(h==='月'?'left':'right')+';color:'+C.textS+';font-weight:600;font-size:11px">'+h+'</th>';
      }).join('')+'</tr></thead><tbody>'+tRows+'</tbody></table></div>','padding:18px 20px')
    +'</div>';
}

function buildKpiTab(){
  var kpi=S.kpiData[S.selMonth]||{};
  var hasData=!!S.kpiData[S.selMonth];
  var editMode=(S.kpiEditMode===S.selMonth);
  var cats=['売上','会員','稼働','財務','所感'].filter(function(c){return KPI_FIELDS.some(function(f){return f[3]===c;});});

  if(editMode){
    var sections=cats.map(function(cat){
      var flds=KPI_FIELDS.filter(function(f){return f[3]===cat;});
      var cc=CAT_COLOR[cat];
      var rows=flds.map(function(f){
        var key=f[0],label=f[1],unit=f[2];
        var val=kpi[key];
        var curStr=(val!=null&&val!=='')?String(val):'';
        var placeholder=unit==='man'?'例: 653179（円単位）':unit==='yen'?'例: 9332（円単位）':unit==='pct'?'例: 83（数字のみ）':unit==='mei'?'例: 174（人数）':unit==='num'?'例: 134（件数）':'テキストを入力';
        var hint=unit==='man'?'円単位で入力（表示は万円に変換）':unit==='yen'?'円単位で入力':unit==='pct'?'%の数字のみ（例: 83）':unit==='mei'?'人数のみ':unit==='num'?'件数のみ':'';
        if(unit==='str'){
          return'<div style="padding:10px 14px;border-radius:9px;background:'+C.surf+';border:1px solid '+C.border+'">'
            +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px">'
            +'<div style="font-size:12px;font-weight:700;color:'+cc+'">'+esc(label)+'</div>'
            +(val!=null&&val!==''?'<div style="font-size:10px;color:'+C.textX+'">（保存済み）</div>':'<div style="font-size:10px;color:'+C.textX+'">未設定</div>')
            +'</div>'
            +'<textarea class="kpi-inp kpi-field" data-key="'+key+'" rows="4" style="resize:vertical;width:100%">'+esc(curStr)+'</textarea>'
            +'</div>';
        }
        var inputEl='<input class="kpi-inp kpi-field" data-key="'+key+'" type="number" value="'+esc(curStr)+'" placeholder="'+esc(placeholder)+'" step="any"/>';
        return'<div style="display:grid;grid-template-columns:1fr 1.4fr auto;align-items:start;gap:10px;padding:9px 12px;border-radius:9px;background:'+C.surf+';border:1px solid '+C.border+'">'
          +'<div><div style="font-size:12px;font-weight:700;color:'+cc+'">'+esc(label)+'</div><div style="font-size:10px;color:'+C.textX+';margin-top:2px">'+esc(hint)+'</div></div>'
          +inputEl
          +'<div style="font-size:11px;color:'+C.textX+';white-space:nowrap;padding-top:8px">'+(val!=null&&val!==''?'現在: '+esc(fmtKpi(val,unit)):'未設定')+'</div>'
          +'</div>';
      }).join('');
      var BIZ_ICONS={'コインランドリー':'🌀 ','宿泊':'🏨 '};
      return'<div style="margin-bottom:18px">'
        +'<div style="font-size:11px;font-weight:700;color:'+cc+';padding:4px 12px;background:'+cc+'18;border-radius:20px;display:inline-flex;align-items:center;gap:4px;margin-bottom:10px">'+(BIZ_ICONS[cat]||'')+cat+'</div>'
        +'<div style="display:flex;flex-direction:column;gap:6px">'+rows+'</div>'
        +'</div>';
    }).join('');
    return card(
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">'
      +'<div><div style="font-size:15px;font-weight:800;color:'+C.text+'">✏️ KPI編集 — '+S.selMonth+'</div>'
      +'<div style="font-size:11px;color:'+C.textX+';margin-top:3px">空欄で保存すると「—」になります。数字項目は数字のみ入力してください。</div></div>'
      +'<div style="display:flex;gap:8px">'+btnS('btn-kpi-cancel','キャンセル','font-size:12px')+btnP('btn-kpi-save','💾 保存','font-size:12px')+'</div>'
      +'</div>'+sections
    );
  }

  if(!hasData){
    return card('<div style="text-align:center;padding:40px 20px">'
      +'<div style="font-size:38px;margin-bottom:12px">📋</div>'
      +'<div style="font-size:15px;font-weight:700;color:'+C.textM+';margin-bottom:8px">'+S.selMonth+'のKPIデータがありません</div>'
      +'<div style="font-size:13px;color:'+C.textS+';margin-bottom:20px">レポートをアップロードするか、手動で直接入力できます</div>'
      +'<div style="display:flex;gap:10px;justify-content:center">'
      +'<input id="kpi-input" type="file" accept=".pdf,.docx,.doc,.txt" style="display:none">'
      +btnP('btn-open-kpi','📄 PDF / docxをアップロード','background:linear-gradient(135deg,'+C.indigo+','+C.purple+')')
      +btnS('btn-kpi-edit','✏️ 手動で入力する')
      +'</div></div>');
  }

  var BIZ_CATS={'コインランドリー':'🌀','宿泊':'🏨'};
  var sections=cats.map(function(cat){
    var cc=CAT_COLOR[cat];
    var numFlds=KPI_FIELDS.filter(function(f){return f[3]===cat&&f[2]!=='str';});
    var strFlds=KPI_FIELDS.filter(function(f){return f[3]===cat&&f[2]==='str';});
    // 事業系カテゴリでデータ未入力ならスキップ
    if(BIZ_CATS[cat]){
      var hasAnyVal=KPI_FIELDS.filter(function(f){return f[3]===cat;}).some(function(f){return kpi[f[0]]!=null&&kpi[f[0]]!=='';});
      if(!hasAnyVal)return'<div style="margin-bottom:18px">'
        +'<div style="font-size:11px;font-weight:700;color:'+cc+';padding:4px 12px;background:'+cc+'18;border-radius:20px;display:inline-flex;align-items:center;gap:5px;margin-bottom:10px">'
        +BIZ_CATS[cat]+' '+cat+'</div>'
        +'<div style="font-size:12px;color:'+C.textX+';padding:10px 14px;background:'+C.surf+';border-radius:10px;border:1px dashed '+C.border+'">未入力（✏️ 編集 から入力できます）</div>'
        +'</div>';
    }
    var tiles=numFlds.map(function(f){return kTile(f[1],fmtKpi(kpi[f[0]],f[2]),cc);}).join('');
    var strHtml=strFlds.map(function(f){
      var v=kpi[f[0]];if(!v)return'';
      var icon=BIZ_CATS[cat]||((f[3]==='稼働')?'🕐':'✨');
      return'<div style="margin-top:12px">'+slabel(icon,f[1])
        +'<div style="font-size:13px;color:'+C.textM+';line-height:1.7;padding:10px 14px;background:'+C.surf+';border-radius:9px;border:1px solid '+C.border+';white-space:pre-wrap">'+esc(v)+'</div></div>';
    }).join('');
    var catLabel='<div style="font-size:11px;font-weight:700;color:'+cc+';padding:4px 12px;background:'+cc+'18;border-radius:20px;display:inline-flex;align-items:center;gap:5px;margin-bottom:10px">'+(BIZ_CATS[cat]?BIZ_CATS[cat]+' ':'')+cat+'</div>';
    return'<div style="margin-bottom:18px">'+catLabel
      +(tiles?'<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">'+tiles+'</div>':'')
      +strHtml+'</div>';
  }).join('');

  return'<div>'
    +'<div style="display:flex;justify-content:flex-end;margin-bottom:14px">'
    +btnS('btn-kpi-edit','✏️ 編集・修正する','font-size:12px')
    +'</div>'+sections+'</div>';
}

function buildMonth(){
  var md=getMonthData(S.selMonth);
  var ai=FM.indexOf(S.selMonth);
  var rep=S.reports[S.selMonth]||{};
  var note=S.finNotes[S.selMonth]||{balance:null,expenses:[]};
  var bal=note.balance;
  var balTemp=note.bal_temp!=null?note.bal_temp:null;
  var exps=note.expenses&&note.expenses.length?note.expenses:[{label:'',amount:'',date:'',type:'plan'}];

  var finHtml='';
  if(md.rev===0&&md.sg===0&&md.op===0&&md.net===0){
    var csvKeys=Object.keys(S.raw).filter(function(k){var d=S.raw[k];return d&&d[S.selMonth]&&d[S.selMonth]!==0;});
    finHtml=card('<div style="text-align:center;padding:20px"><div style="font-size:28px;margin-bottom:8px">📂</div><div style="font-size:14px;font-weight:700;color:'+C.textM+';margin-bottom:6px">'+S.selMonth+'の財務データがありません</div><div style="font-size:12px;color:'+C.textS+';margin-bottom:10px">損益CSVをアップロードするとデータが表示されます</div>'+(csvKeys.length?'<div style="text-align:left;font-size:11px;color:'+C.textS+';background:'+C.surf+';border-radius:8px;padding:10px;margin-top:8px"><div style="font-weight:700;margin-bottom:4px">📋 CSVの列名:</div>'+csvKeys.slice(0,15).map(function(k){return'<div>・'+esc(k)+'</div>';}).join('')+'</div>':'')+'</div>');
  }else{
    var plTemp=note.pl_temp||{};
    var editPl=(S.finEditPl===S.selMonth);

    // CSV値取得
    function getRaw(key){var d=S.raw[key];if(!d)return 0;var v=d[S.selMonth];return(v!=null&&v!=='')?(+v)||0:0;}
    // plTemp取得 {v, confirmed} or null
    function getPt(key){var e=plTemp[key];if(e==null)return null;if(typeof e==='object')return e;return{v:e,confirmed:false};}
    // 表示値：手入力があれば手入力値、なければCSV値
    function effVal(key){var pt=getPt(key);return(pt!=null&&pt.v!=null)?pt.v:getRaw(key);}
    // ステータス
    function getStatus(key){
      if(getRaw(key)!==0&&getPt(key)==null)return'csv';   // CSV値のみ
      if(getPt(key)==null)return'none';                    // 未入力
      if(getRaw(key)!==0)return'override';                 // CSV上書き
      return getPt(key).confirmed?'confirmed':'temp';      // 手入力のみ
    }

    // 費用項目キー
    var sgKeys=['役員報酬','給料賃金','法定福利費','業務委託料','地代家賃','水道光熱費','備品・消耗品費','広告宣伝費','通信費'];

    // 集計値を手入力ベースで再計算
    var calcSg=0;
    sgKeys.forEach(function(k){calcSg+=effVal(k);});
    // 売上高の手入力
    var calcRev=effVal('売上高')||md.rev;
    // 販管費合計：個別項目の合計（CSV or 手入力）
    // ただし個別項目がすべて0の場合はCSVのmd.sgを使う
    var hasAnyItem=sgKeys.some(function(k){return effVal(k)!==0;});
    var effSg=hasAnyItem?calcSg:md.sg;
    var effRev=calcRev;
    // 営業利益以降：CSVに値があればCSV、なければ再計算
    var effOp=md.op!==0?md.op+(effSg-md.sg)*-1+(effRev-md.rev):effRev-effSg;
    var effEco=md.eco!==0?md.eco+(effSg-md.sg)*-1+(effRev-md.rev):effOp;
    // 純利益は経常利益との差（特別損益）を保持して計算
    var specialPL=md.net-md.eco;
    var effNet=effEco+specialPL;
    var hasAdjust=sgKeys.some(function(k){return getPt(k)!=null;});

    // バッジ
    function statusBadge(st){
      if(st==='csv')return'<span style="font-size:9px;font-weight:800;padding:1px 6px;border-radius:8px;background:'+C.teal+';color:white">CSV</span>';
      if(st==='override')return'<span style="font-size:9px;font-weight:800;padding:1px 6px;border-radius:8px;background:'+C.blue+';color:white">修正</span>';
      if(st==='confirmed')return'<span style="font-size:9px;font-weight:800;padding:1px 6px;border-radius:8px;background:'+C.green+';color:white">確定</span>';
      if(st==='temp')return'<span style="font-size:9px;font-weight:800;padding:1px 6px;border-radius:8px;background:'+C.amber+';color:white">仮</span>';
      return'';
    }

    // 明細行定義
    var detailDefs=[
      {key:'売上高',bold:true,color:C.teal,editable:true},
      {key:'売上原価合計',bold:false,color:C.textS,editable:true},
      {key:'売上総利益',bold:true,color:C.teal,editable:false,calcVal:effRev},
      null,
    ];
    sgKeys.forEach(function(k){detailDefs.push({key:k,bold:false,color:C.textS,editable:true});});
    detailDefs=detailDefs.concat([
      null,
      {key:'販管費合計',bold:true,color:C.amber,editable:false,calcVal:effSg},
      {key:'営業利益',bold:true,color:effOp>=0?C.green:C.red,editable:false,calcVal:effOp},
      {key:'経常利益',bold:true,color:effEco>=0?C.green:C.red,editable:false,calcVal:effEco},
      {key:'純利益',bold:true,color:effNet>=0?C.green:C.red,editable:false,calcVal:effNet},
    ]);

    var dRows=detailDefs.map(function(row){
      if(!row)return'<div style="height:1px;background:'+C.border+';margin:4px 0;grid-column:1/-1"></div>';
      var v=row.calcVal!=null?row.calcVal:effVal(row.key);
      var st=row.editable?getStatus(row.key):(row.calcVal!=null?'calc':'csv');
      var pt=row.editable?getPt(row.key):null;
      var bgColor=row.bold?row.color+'12':(st==='temp'?C.amberL:st==='confirmed'?C.greenL:st==='override'?C.blueL:'transparent');
      return'<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 10px;border-radius:7px;background:'+bgColor+';gap:8px">'
        +'<span style="font-size:12.5px;color:'+(row.bold?C.textM:C.textS)+';font-weight:'+(row.bold?600:400)+';flex-shrink:0">'+esc(row.key)+'</span>'
        +(editPl&&row.editable
          ?'<div style="display:flex;align-items:center;gap:5px;flex:1;justify-content:flex-end">'
            +statusBadge(st)
            +'<select class="pl-status-sel" data-key="'+esc(row.key)+'" style="padding:3px 6px;border-radius:6px;border:1px solid '+C.border+';font-size:11px">'
              +'<option value="temp"'+(pt&&!pt.confirmed?' selected':'')+'>🟡 仮</option>'
              +'<option value="confirmed"'+(pt&&pt.confirmed?' selected':'')+'>🟢 確定</option>'
            +'</select>'
            +'<input class="pl-temp-inp" data-key="'+esc(row.key)+'" type="number" value="'+(pt!=null?pt.v:getRaw(row.key)||'')+'" placeholder="（円）" style="width:110px;padding:4px 8px;border-radius:6px;border:1.5px solid '+(st==='temp'?C.amber:st==='confirmed'?C.green:C.border)+';font-size:12px;text-align:right"/>'
            +'<span style="font-size:10px;color:'+C.textX+'">円</span>'
          +'</div>'
          :'<div style="display:flex;align-items:center;gap:5px">'
            +(row.editable?statusBadge(st):'')
            +'<span style="font-size:12.5px;font-weight:'+(row.bold?700:500)+';color:'+(v<0?C.red:row.color)+'">'+(v===0&&!row.bold?'—':(v<0?'▲':'')+Math.abs(v).toLocaleString()+'円')+'</span>'
          +'</div>'
        )
        +'</div>';
    }).join('');

    finHtml='<div>'
      +'<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:14px">'
      +kTile('売上',fmtM(effRev),C.teal)
      +kTile('販管費',fmtM(effSg),C.amber)
      +kTile('営業利益',fmtM(effOp),effOp>=0?C.green:C.red)
      +kTile('経常利益',fmtM(effEco),effEco>=0?C.green:C.red)
      +kTile('純利益',fmtM(effNet),effNet>=0?C.green:C.red)
      +'</div>'
      +(hasAdjust?'<div style="font-size:10px;color:'+C.amber+';margin-bottom:10px;padding:6px 12px;background:'+C.amberL+';border-radius:8px;border:1px solid '+C.amber+'33">📝 手入力の値を反映した試算です。CSV確定後も手入力値で上書き表示されます。</div>':'')
      +card(
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">'
          +slabel('📋','損益計算書 明細')
          +(editPl
            ?'<div style="display:flex;gap:6px">'+btnS('btn-cancel-pl','✕ キャンセル','font-size:11px;padding:5px 12px')+btnP('btn-save-pl-temp','💾 保存','font-size:11px;padding:5px 16px')+'</div>'
            :'<div style="display:flex;align-items:center;gap:8px">'
              +(hasAdjust?'<span style="font-size:10px;font-weight:800;padding:2px 8px;border-radius:8px;background:'+C.amber+';color:white">手入力あり</span>':'')
              +btnS('btn-edit-pl','✏️ 数字を編集','font-size:11px;padding:5px 12px')
            +'</div>'
          )
        +'</div>'
        +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:3px">'+dRows+'</div>'
      )
      +'</div>';
  }

  var savedExps=(note.expenses||[]).filter(function(e){return e.label;});
  var expList=savedExps.length===0
    ?'<div style="text-align:center;padding:14px;font-size:12px;color:'+C.textX+'">大型支出の記録はありません</div>'
    :savedExps.map(function(e){
      var tg=e.type==='plan'?C.purple:C.orange;
      return'<div style="display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;background:'+(e.type==='plan'?C.purpleL:C.amberL)+';border:1px solid '+(e.type==='plan'?C.purple+'33':C.amber+'44')+'">'
        +'<span style="font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;background:'+tg+';color:white;flex-shrink:0">'+(e.type==='plan'?'予定':'実績')+'</span>'
        +(e.date?'<span style="font-size:11px;color:'+C.textS+'">'+esc(e.date)+'</span>':'')
        +'<span style="flex:1;font-size:13px;font-weight:600;color:'+C.textM+'">'+esc(e.label)+'</span>'
        +(e.amount?'<span style="font-size:14px;font-weight:800;color:'+tg+'">'+fmtM(e.amount*10000)+'</span>':'')
        +'</div>';
    }).join('');
  var expFormRows=exps.map(function(e,i){
    return'<div style="display:grid;grid-template-columns:auto 1fr auto auto auto;gap:6px;align-items:center;padding:8px;background:'+C.surf+';border-radius:8px;border:1px solid '+C.border+'">'
      +'<select data-ei="'+i+'" class="exp-type" style="padding:5px 7px;border-radius:6px;border:1px solid '+C.border+';font-size:11px;background:'+C.white+'">'
      +'<option value="plan"'+(e.type==='plan'?' selected':'')+'>📅 予定</option>'
      +'<option value="actual"'+(e.type==='actual'?' selected':'')+'>✅ 実績</option>'
      +'</select>'
      +'<input data-ei="'+i+'" class="exp-label" value="'+esc(e.label||'')+'" placeholder="支出名" style="padding:5px 9px;border-radius:6px;border:1px solid '+C.border+';font-size:12px;min-width:0"/>'
      +'<input data-ei="'+i+'" class="exp-date" type="date" value="'+esc(e.date||'')+'" style="padding:5px 7px;border-radius:6px;border:1px solid '+C.border+';font-size:11px;width:130px"/>'
      +'<div style="display:flex;align-items:center;gap:4px">'

function parseBsCSV(text){
  if(!text||!text.trim())return{};
  var lines=text.split(/\r?\n/).filter(function(l){return l.trim();});
  var data={};
  lines.forEach(function(line){
    var cs;
    try{
      var re=/"(?:[^"]|"")*"|[^,]*/g;
      cs=(line.match(re)||[]).map(function(s){return s.replace(/^"|"$/g,'').replace(/""/g,'"');});
    }catch(e){cs=line.split(',');}
    // 列0: 合計行ラベル（例:「現金及び預金合計」）
    // 列1: 勘定科目（例:「普通預金」）
    // 列2: 補助科目（例:「沖縄海邦銀行」）→ 無視
    // 列6: 残高（終了月残高）
    var label='';
    if(cs[0]&&cs[0].trim())label=cs[0].trim();         // 合計行 or セクション見出し
    else if(cs[1]&&cs[1].trim())label=cs[1].trim();    // 明細行（勘定科目）
    if(!label)return;
    // 補助科目行（列2に値あり）は合算しないためスキップ
    if(cs[2]&&cs[2].trim())return;
    var raw=(cs[6]||'').replace(/,/g,'');
    var val=(raw!==''&&raw!==undefined&&!isNaN(parseInt(raw)))?parseInt(raw):null;
    if(val!==null&&!data[label])data[label]=val;
  });
  return data;
}

    var v=bs[d.key];

  if(!biz){
    return card('<div style="text-align:center;padding:40px 20px">'
      +'<div style="font-size:48px;margin-bottom:16px">🏢</div>'

      +'<div style="font-size:13px;color:'+C.textS+';line-height:1.9;margin-bottom:24px">'
        +'マネーフォワード → 会計 → レポート → <b>損益計算書（部門別集計表）</b><br>'
        +'対象期間: <b>'+fyRange(S.fy)+'</b> でCSVダウンロード後<br>'

  var DEPTS=[
    {key:"gym",    label:"スポーツクラブ", icon:"💪", color:C.teal,  colorL:C.tealL},
    {key:"laundry",label:"コインランドリー",icon:"🌀", color:C.green, colorL:C.greenL},
    {key:"stay",   label:"宿泊事業",       icon:"🏨", color:C.pink,  colorL:"#fff0f7"},
    {key:"common", label:"共通費",         icon:"🏛️", color:C.amber, colorL:C.amberL},
    {key:"total",  label:"全社合計",       icon:"Σ",  color:C.indigo,colorL:C.blueL},
  ];

  function g(dept,key){var v=biz[dept]&&biz[dept][key];return(v!=null)?v:0;}

  function deptSales(k){return g(k,"売上高");}
  function deptCost(k){
    var v=g(k,"販売費及び一般管理費合計");if(v)return v;
    return ["役員報酬","給料賃金","法定福利費","福利厚生費","研修採用費","業務委託料","水道光熱費","広告宣伝費","通信費","地代家賃","賃借料","リース代","支払手数料","修繕費","保険料","租税公課","支払報酬","接待交際費","旅費交通費","荷造運賃","備品・消耗品費","会議費","新聞図書費","諸会費","車両費","雑費"].reduce(function(s,kk){return s+g(k,kk);},0);
  }
  function deptProfit(k){return g(k,"営業利益")||(deptSales(k)-deptCost(k));}

  var totalSales=DEPTS.slice(0,3).reduce(function(s,d){return s+deptSales(d.key);},0);

  // ── 事業別KPIカード ──────────────────────────────────
  function deptCard(dept){
    var sales=deptSales(dept.key),cost=deptCost(dept.key),profit=deptProfit(dept.key);
    var share=totalSales>0?Math.round(sales/totalSales*100):0;
    var margin=sales>0?Math.round(profit/sales*100):0;
    var hasData=sales>0||cost>0;
    return '<div style="background:'+C.white+';border-radius:14px;border:1px solid '+C.border+';overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.05)">'
      +'<div style="padding:11px 16px;background:'+dept.colorL+';border-bottom:1px solid '+dept.color+'22;display:flex;align-items:center;gap:8px">'
        +'<span style="font-size:18px">'+dept.icon+'</span>'
        +'<span style="font-size:14px;font-weight:800;color:'+dept.color+'">'+dept.label+'</span>'
        +(hasData
          ?'<span style="margin-left:auto;font-size:10px;font-weight:700;padding:2px 9px;border-radius:12px;background:'+dept.color+';color:white">売上シェア '+share+'%</span>'
          :'<span style="margin-left:auto;font-size:10px;color:'+C.textX+'">未稼働 / 未入力</span>')
      +'</div>'
      +'<div style="padding:14px 16px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">'
        +kTile("年間売上",fmtM(sales),dept.color)
        +kTile("年間支出",fmtM(cost),C.amber)
        +kTile("営業利益",fmtM(profit),profit>=0?C.green:C.red,"利益率 "+margin+"%")
      +'</div>'
    +'</div>';
  }

  var kpiCards='<div style="display:flex;flex-direction:column;gap:12px;margin-bottom:20px">'
    +DEPTS.slice(0,3).map(function(d){return deptCard(d);}).join('')
    +'</div>';

  // ── 売上シェア バー ──────────────────────────────────
  var shareHtml='';
  if(totalSales>0){
    var barItems=DEPTS.slice(0,3).map(function(d){
      var s=deptSales(d.key),pct=totalSales>0?Math.round(s/totalSales*100):0;
      return '<div style="margin-bottom:8px">'
        +'<div style="display:flex;justify-content:space-between;margin-bottom:3px">'
          +'<span style="font-size:12px;font-weight:700;color:'+C.textM+'">'+d.icon+' '+d.label+'</span>'
          +'<span style="font-size:12px;font-weight:800;color:'+d.color+'">'+fmtM(s)+' ('+pct+'%)</span>'
        +'</div>'
        +'<div style="height:10px;background:'+C.surf+';border-radius:5px;overflow:hidden">'
          +'<div style="height:100%;width:'+pct+'%;background:'+d.color+';border-radius:5px"></div>'
        +'</div></div>';
    }).join('');
    shareHtml='<div style="margin-bottom:14px">'+card(slabel("🥧","売上構成（年間）")+barItems
      +'<div style="margin-top:10px;padding-top:10px;border-top:1px solid '+C.border+';display:flex;justify-content:space-between">'
        +'<span style="font-size:12px;color:'+C.textS+'">事業計</span>'
        +'<span style="font-size:16px;font-weight:900;color:'+C.teal+'">'+fmtM(totalSales)+'</span>'
      +'</div>'
    )+'</div>';
  }

  // ── 費目別 部門比較テーブル ───────────────────────────
  var COST_ITEMS=["役員報酬","給料賃金","法定福利費","福利厚生費","研修採用費","業務委託料","水道光熱費","広告宣伝費","通信費","地代家賃","賃借料","リース代","支払手数料","修繕費","保険料","租税公課","支払報酬","接待交際費","旅費交通費","荷造運賃","備品・消耗品費","会議費","新聞図書費","諸会費","車両費","雑費"];
  var activeDepts=DEPTS.filter(function(d){return deptSales(d.key)||deptCost(d.key);});

  var thCells=activeDepts.map(function(d){
    return '<th style="padding:8px 12px;text-align:right;font-size:11px;color:'+d.color+';white-space:nowrap">'+d.icon+' '+d.label+'</th>';
  }).join('');

  var salesRow='<tr style="background:'+C.tealL+'">'
    +'<td style="padding:8px 12px;font-size:12px;font-weight:800;color:'+C.teal+'">売上高</td>'
    +activeDepts.map(function(d){var v=deptSales(d.key);return '<td style="padding:8px 12px;text-align:right;font-size:13px;font-weight:800;color:'+C.teal+'">'+(v?fmtM(v):"—")+'</td>';}).join('')
    +'</tr>';

  var costRows=COST_ITEMS.filter(function(item){
    return activeDepts.some(function(d){return g(d.key,item)!==0;});
  }).map(function(item){
    return '<tr style="border-bottom:1px solid '+C.border+'">'
      +'<td style="padding:6px 12px;font-size:12px;color:'+C.textM+'">'+item+'</td>'
      +activeDepts.map(function(d){var v=g(d.key,item);return '<td style="padding:6px 12px;text-align:right;font-size:12px;color:'+(v>0?C.text:C.textX)+'">'+(v>0?Math.round(v/10000).toLocaleString()+"万":"—")+'</td>';}).join('')
      +'</tr>';
  }).join('');

  var sumRow='<tr style="background:'+C.surf+';border-top:2px solid '+C.border+'">'
    +'<td style="padding:8px 12px;font-size:12px;font-weight:700;color:'+C.textM+'">販管費合計</td>'
    +activeDepts.map(function(d){var v=deptCost(d.key);return '<td style="padding:8px 12px;text-align:right;font-size:12px;font-weight:700;color:'+C.amber+'">'+Math.round(v/10000).toLocaleString()+"万</td>";}).join('')+'</tr>';

  var profitRow='<tr style="background:'+C.greenL+'">'
    +'<td style="padding:8px 12px;font-size:12px;font-weight:800;color:'+C.textM+'">営業利益</td>'
    +activeDepts.map(function(d){var v=deptProfit(d.key);return '<td style="padding:8px 12px;text-align:right;font-size:13px;font-weight:800;color:'+(v>=0?C.green:C.red)+'">'+fmtM(v)+'</td>';}).join('')+'</tr>';

  var costTable=cardNP(
    slabel("📋","費目別 部門収支比較（年間）")
    +'<div style="font-size:11px;color:'+C.textX+';margin-bottom:10px">部門別CSVの年間累計。ゼロ行は省略。</div>'
    +'<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;min-width:460px">'
      +'<thead><tr style="background:'+C.surf+';border-bottom:2px solid '+C.border+'">'
        +'<th style="padding:8px 12px;text-align:left;font-size:11px;color:'+C.textS+'">費目</th>'+thCells
      +'</tr></thead>'
      +'<tbody>'+salesRow+costRows+sumRow+profitRow+'</tbody>'
    +'</table></div>',"padding:18px 20px"
  );

  return '<div>'+kpiCards+shareHtml+'<div style="margin-bottom:14px">'+costTable+'</div></div>';
}

function buildBlockPuzzle(active, totalRev, totalSg){
  if(!active||!active.length||!totalRev){
    return '<div style="text-align:center;padding:40px;color:'+C.textX+';font-size:13px">損益CSVをアップロードすると財務ビジュアルが表示されます</div>';
  }
  function sumRaw(keys){
    return keys.reduce(function(s,k){
      var d=S.raw[k];if(!d)return s;
      return s+active.reduce(function(ss,dd){
        var v=d[dd.month];return ss+((v!=null&&v!=='')?+v:0);
      },0);
    },0);
  }
  // ── CSVの集計値を直接使って数字を統一 ─────────────────────
  // 売上高・販管費合計・営業利益はgetMonthDataと同じCSV科目から取得
  var uriage = totalRev; // buildTrendから渡されたCSV値をそのまま使用

  // 販管費の内訳はCSVから個別取得（構造の可視化用）
  var hendou  = sumRaw(['水道光熱費','業務委託料','広告宣伝費','接待交際費','旅費交通費','荷造運賃']);
  var jinken  = sumRaw(['役員報酬','給料賃金','法定福利費','福利厚生費','研修採用費']);
  var sonota  = sumRaw(['備品・消耗品費','支払手数料','支払報酬','修繕費','会議費','新聞図書費','諸会費','車両費','雑費',
                        '地代家賃','賃借料','リース代','通信費','保険料','租税公課','支払報酬','荷造運賃']);
  // ただし販管費合計はCSVの合計行を優先（各科目の合算とのズレを防ぐ）
  var sgTotal = totalSg; // buildTrendから渡されたCSV「販管費及び一般管理費合計」
  // hendou+jinken+sonotaの合計をsgTotalに合わせてスケール補正
  var rawSum  = hendou + jinken + sonota;
  if(rawSum > 0 && sgTotal > 0){
    var scale = sgTotal / rawSum;
    hendou = Math.round(hendou * scale);
    jinken = Math.round(jinken * scale);
    sonota = Math.round(sonota * scale);
  }
  var kotei_sum = jinken + sonota;
  // 営業利益もCSVの値を直接使用
  var rieki = active.reduce(function(s,d){return s+d.op;},0);
  var arari = uriage - hendou; // 粗利（変動費控除後）
  var akaji = Math.max(0, -rieki);

  var totalW = hendou + kotei_sum;

  function fmt(n){return Math.round(Math.abs(n)/10000).toLocaleString()+'万';}
  function pc(v){return Math.round(Math.abs(v)/uriage*100)+'%';}
  function fl(v){return Math.max(1,Math.round(Math.abs(v)/totalW*10000));}

  var DETAILS={
    hendou:[
      {name:'水道光熱費',val:sumRaw(['水道光熱費'])},
      {name:'業務委託料',val:sumRaw(['業務委託料'])},
      {name:'広告宣伝費',val:sumRaw(['広告宣伝費'])},
      {name:'接待交際費',val:sumRaw(['接待交際費'])},
      {name:'旅費交通費',val:sumRaw(['旅費交通費'])},
      {name:'荷造運賃',  val:sumRaw(['荷造運賃'])},
    ],
    sonota:[
      {name:'支払手数料',val:sumRaw(['支払手数料'])},
      {name:'備品消耗品',val:sumRaw(['備品・消耗品費'])},
      {name:'支払報酬',  val:sumRaw(['支払報酬'])},
      {name:'修繕費',    val:sumRaw(['修繕費'])},
      {name:'諸経費',    val:sumRaw(['会議費','新聞図書費','諸会費','車両費','雑費'])},
    ],
    jinken:[
      {name:'給料賃金',  val:sumRaw(['給料賃金'])},
      {name:'役員報酬',  val:sumRaw(['役員報酬'])},
      {name:'法定福利費',val:sumRaw(['法定福利費'])},
      {name:'福利厚生費',val:sumRaw(['福利厚生費'])},
      {name:'研修採用費',val:sumRaw(['研修採用費'])},
    ],
  };

  var uid='db'+Math.floor(Math.random()*99999);

  function detailRows(key,color,base){
    return (DETAILS[key]||[]).filter(function(d){return d.val>0;}).map(function(d){
      var bw=Math.min(100,Math.round(d.val/(base||1)*100));
      return '<div style="display:flex;align-items:center;gap:5px;margin-bottom:4px;">'
        +'<span style="font-size:10px;color:'+C.textS+';width:72px;flex-shrink:0;text-align:right;">'+esc(d.name)+'</span>'
        +'<div style="flex:1;height:9px;background:'+C.border+';border-radius:2px;overflow:hidden;">'
          +'<div style="width:'+bw+'%;height:100%;background:'+color+';opacity:0.6;border-radius:2px;"></div>'
        +'</div>'
        +'<span style="font-size:10px;color:'+C.textM+';white-space:nowrap;width:40px;text-align:right;">'+fmt(d.val)+'</span>'
        +'<span style="font-size:9px;color:'+C.textX+';white-space:nowrap;width:28px;">'+pc(d.val)+'</span>'
        +'</div>';
    }).join('');
  }

  function makeBlk(key,label,val,bg,bd,tc,color){
    var pid=uid+key;
    return '<div style="flex:'+fl(val)+';min-width:0;display:flex;flex-direction:column;">'
      +'<div onclick="(function(el){'
        +'var p=document.getElementById(\''+pid+'\');if(!p)return;'
        +'var o=el.getAttribute(\'data-o\')==\'1\';'
        +'p.style.maxHeight=o?\'0\':\'400px\';'
        +'el.setAttribute(\'data-o\',o?\'0\':\'1\');'
        +'el.querySelector(\'.chv\').textContent=o?\'▼\':\'▲\';'
      +'})(this);" data-o="0" '
      +'style="cursor:pointer;flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;'
        +'border-radius:4px 4px 0 0;padding:8px 4px;min-height:62px;overflow:hidden;box-sizing:border-box;'
        +'background:'+bg+';color:'+tc+';border:1px solid '+bd+';">'
        +'<div style="font-size:11px;font-weight:600;width:100%;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+label+'</div>'
        +'<div style="font-size:11px;font-weight:500;margin-top:2px;">'+(val<0?'▲':'')+fmt(val)+'</div>'
        +'<div style="font-size:9px;opacity:0.7;">'+pc(val)+'</div>'
        +'<div class="chv" style="font-size:9px;margin-top:2px;opacity:0.4;">▼</div>'
      +'</div>'
      +'<div id="'+pid+'" style="max-height:0;overflow:hidden;transition:max-height 0.3s ease;'
        +'background:'+C.surf+';border:1px solid '+bd+';border-top:none;border-radius:0 0 4px 4px;">'
        +'<div style="padding:8px 6px;">'+detailRows(key,color,val)+'</div>'
      +'</div>'
    +'</div>';
  }

  var axStyle='width:60px;flex-shrink:0;display:flex;align-items:flex-start;justify-content:flex-end;'
    +'padding-right:10px;padding-top:20px;font-size:13px;font-weight:600;color:'+C.textS+';border-right:2px solid '+C.border+';';

  var rColor=rieki>=0?C.green:C.red;
  var rSign=rieki>=0?'+':'▲';

  var html=''
    // ── 行1：[売上高(uriage)][赤字(akaji)] → 合計=totalW ──
    +'<div style="display:flex;align-items:stretch;margin-bottom:6px;">'
      +'<div style="'+axStyle+'">売上</div>'
      +'<div style="flex:1;min-width:0;padding-left:8px;display:flex;gap:4px;overflow:hidden;">'
        +'<div style="flex:'+fl(uriage)+';min-width:0;display:flex;flex-direction:column;justify-content:center;align-items:center;'
          +'border-radius:4px;padding:10px 4px;min-height:62px;background:#e8f5ee;color:#1a5c38;border:1px solid #7cc49a;">'
          +'<div style="font-size:12px;font-weight:600;">売上高</div>'
          +'<div style="font-size:14px;font-weight:700;margin-top:2px;">'+fmt(uriage)+'</div>'
          +'<div style="font-size:10px;opacity:0.7;">100%</div>'
        +'</div>'
        +(akaji>0
          ?'<div style="width:4px;flex-shrink:0;"></div>'
           +'<div style="flex:'+fl(akaji)+';min-width:0;display:flex;flex-direction:column;justify-content:center;align-items:center;'
             +'border-radius:4px;padding:8px 4px;min-height:62px;background:#fdeaea;color:#7a1212;border:1.5px dashed #e08080;">'
             +'<div style="font-size:11px;font-weight:600;">赤字</div>'
             +'<div style="font-size:11px;font-weight:500;margin-top:2px;">▲'+fmt(akaji)+'</div>'
             +'<div style="font-size:9px;opacity:0.7;">▲'+pc(akaji)+'</div>'
           +'</div>'
          :'')
      +'</div>'
    +'</div>'

    // ── 行2：[変動費(hendou)][粗利(arari)][スペース(akaji)] → 合計=totalW ──
    +'<div style="display:flex;align-items:flex-start;margin-bottom:6px;">'
      +'<div style="'+axStyle+'">変動</div>'
      +'<div style="flex:1;min-width:0;padding-left:8px;display:flex;gap:4px;align-items:flex-start;overflow:hidden;">'
        +makeBlk('hendou','変動費',hendou,'#fdeee8','#e0856a','#7a2e12','#e0856a')
        +(arari>0
          ?'<div style="width:4px;flex-shrink:0;"></div>'
           +'<div style="flex:'+fl(arari)+';min-width:0;display:flex;flex-direction:column;justify-content:center;align-items:center;'
             +'border-radius:4px;padding:8px 4px;min-height:62px;background:#fff;color:#3a2f80;border:1.5px dashed #7b6ed6;">'
             +'<div style="font-size:11px;font-weight:600;">粗利</div>'
             +'<div style="font-size:12px;font-weight:700;margin-top:2px;">'+fmt(arari)+'</div>'
             +'<div style="font-size:10px;opacity:0.7;">'+pc(arari)+'</div>'
           +'</div>'
          :'')
        // 赤字分のスペーサー（行1の赤字と幅を揃える）
        +(akaji>0?'<div style="width:4px;flex-shrink:0;"></div><div style="flex:'+fl(akaji)+';min-width:0;"></div>':'')
      +'</div>'
    +'</div>'

    // 区切り線
    +'<div style="height:1px;background:'+C.border+';margin:2px 0 6px 68px;"></div>'

    // ── 行3：[スペース(hendou)][その他(sonota)][人件費(jinken)] → 合計=totalW ──
    // 赤字なし。右端が行1の右端（売上+赤字）と揃う
    +'<div style="display:flex;align-items:flex-start;">'
      +'<div style="'+axStyle+'">固定</div>'
      +'<div style="flex:1;min-width:0;padding-left:8px;display:flex;gap:4px;align-items:flex-start;overflow:hidden;">'
        +'<div style="flex:'+fl(hendou)+';min-width:0;"></div>'
        +'<div style="width:4px;flex-shrink:0;"></div>'
        +makeBlk('sonota','その他',sonota,'#f2f0eb','#c0bdb5','#444','#c0bdb5')
        +'<div style="width:4px;flex-shrink:0;"></div>'
        +makeBlk('jinken','人件費',jinken,'#eeedfb','#9b94e0','#3a2f80','#9b94e0')
      +'</div>'
    +'</div>'

    // サマリー
    +'<div style="display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:1rem;padding-top:1rem;'
      +'border-top:1px solid '+C.border+';padding-left:68px;font-size:12px;color:'+C.textS+'">'
      +'<span>粗利率: <b style="color:'+C.teal+'">'+pc(arari)+'</b></span>'
      +'<span>固定費合計: <b style="color:'+C.amber+'">'+fmt(kotei_sum)+'</b></span>'
      +'<span>人件費比率: <b style="color:'+C.indigo+'">'+pc(jinken)+'</b></span>'
      +'<span>営業利益: <b style="color:'+rColor+'">'+rSign+fmt(Math.abs(rieki))+'</b></span>'
    +'</div>';

  return '<div style="overflow:hidden;">'+card(html)+'</div>';
}

async function extractDocxText(ab){
  if(typeof JSZip==='undefined')throw new Error('JSZipが読み込まれていません');
  var zip=await JSZip.loadAsync(ab);
  var xmlFile=zip.file('word/document.xml');
  if(!xmlFile)throw new Error('word/document.xmlが見つかりません');
  var xml=await xmlFile.async('text');
  return xml
    .replace(/<w:p[ >]/g,'\n<w:p ')
    .replace(/<w:br[^/]*\/>/g,'\n')
    .replace(/<[^>]+>/g,'')
    .replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').replace(/&apos;/g,"'").replace(/&quot;/g,'"')
    .replace(/[ \t]+/g,' ')
    .split('\n').map(function(l){return l.trim();}).filter(function(l){return l;}).join('\n')
    .slice(0,6000);
}

async function handleBsCsv(file){
  if(!file||!file.name.endsWith('.csv'))return;
  S.bsName=file.name;
  var ab=await file.arrayBuffer();
  var text;
  try{text=new TextDecoder('cp932').decode(new Uint8Array(ab));}
  catch(e){try{text=new TextDecoder('shift-jis').decode(new Uint8Array(ab));}catch(e2){text=new TextDecoder('utf-8').decode(new Uint8Array(ab));}}
  S.bsData=parseBsCSV(text);
  // 全体タブのB/Sビューに遷移
  S.view='trend';
  S.trendTab='bs';
  if(S.gasConnected){gasPost({action:'save_bs_data',bsName:tagName(S.fy,S.bsName),rawData:text});}
  render();
}

function lnum(v){if(v==null||v==='')return null;if(typeof v==='number')return Math.round(v);var n=parseFloat(String(v).replace(/[,円%\s]/g,''));return isNaN(n)?null:Math.round(n);}
function lmonth(d){if(d instanceof Date&&!isNaN(d))return(d.getMonth()+1)+'月';var mm=/(\d{1,2})\s*月/.exec(String(d));if(mm)return parseInt(mm[1],10)+'月';var dm=/\d{4}\D(\d{1,2})\D\d{1,2}/.exec(String(d));if(dm)return parseInt(dm[1],10)+'月';return null;}
// コインランドリー売上管理Excelを解析（月次サマリー＋損益サマリー）
function parseLaundryXlsx(buf){
  var wb=XLSX.read(buf,{type:'array',cellDates:true});
  function findSheet(kw){var n=null;wb.SheetNames.forEach(function(s){if(n==null&&s.indexOf(kw)>=0)n=s;});return n?wb.Sheets[n]:null;}
  var months={},fy=null;
  function ensure(m){if(!months[m])months[m]={};return months[m];}
  // 月次サマリー：売上・機器別・両替機・稼働率
  var ws=findSheet('月次サマリー');
  if(ws){
    var rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true});
    var hi=-1;for(var i=0;i<rows.length;i++){if((rows[i]||[]).some(function(c){return String(c).indexOf('月次売上合計')>=0;})){hi=i;break;}}
    if(hi>=0){
      var hdr=(rows[hi]||[]).map(function(c){return String(c==null?'':c);});
      function col(kw){for(var c=0;c<hdr.length;c++){if(hdr[c].indexOf(kw)>=0)return c;}return -1;}
      var cDm=col('乾燥機(中)'),cDl=col('乾燥機(大)'),cW=col('洗濯乾燥機'),cTot=col('月次売上合計'),cChg=col('両替機'),cUtil=col('稼働率');
      for(var i=hi+1;i<rows.length;i++){
        var r=rows[i]||[];var ml=lmonth(r[0]);if(!ml)continue;
        if(fy==null&&r[0] instanceof Date){var y=r[0].getFullYear(),mo=r[0].getMonth()+1;fy=mo>=5?y:y-1;}
        var o=ensure(ml);
        if(cTot>=0)o.laundry_sales=lnum(r[cTot]);
        if(cDm>=0)o.laundry_dryer_m=lnum(r[cDm]);
        if(cDl>=0)o.laundry_dryer_l=lnum(r[cDl]);
        if(cW>=0)o.laundry_washer=lnum(r[cW]);
        if(cChg>=0)o.laundry_changer=lnum(r[cChg]);
        if(cUtil>=0){var u=r[cUtil];if(u!=null&&u!==''){var uf=parseFloat(u);if(!isNaN(uf))o.laundry_util=uf<=1?Math.round(uf*1000)/10:Math.round(uf*10)/10;}}
      }
    }
  }
  // 損益サマリー：経費合計・人件費・営業利益
  var ps=findSheet('損益サマリー');
  if(ps){
    var prows=XLSX.utils.sheet_to_json(ps,{header:1,raw:true});
    var phi=-1;for(var i=0;i<prows.length;i++){if((prows[i]||[]).some(function(c){return String(c).indexOf('項目')>=0;})){phi=i;break;}}
    if(phi>=0){
      var colMonth={};(prows[phi]||[]).forEach(function(c,ci){var ml=lmonth(c);if(ml)colMonth[ci]=ml;});
      function rowByLabel(kw){for(var i=phi+1;i<prows.length;i++){var r=prows[i]||[];for(var c=0;c<r.length;c++){if(String(r[c]).indexOf(kw)>=0)return r;}}return null;}
      function applyRow(kw,field){var r=rowByLabel(kw);if(!r)return;Object.keys(colMonth).forEach(function(c){var v=r[c];if(v!=null&&v!==''&&typeof v!=='object')ensure(colMonth[c])[field]=lnum(v);});}
      applyRow('経費合計','laundry_expense');
      applyRow('人件費','laundry_labor');
      applyRow('営業利益','laundry_op');
    }
  }
  // 稼働率分析：機種タイプ(M/L/XL)ごとに、各月の平均稼働率を算出
  var us=findSheet('稼働率分析');
  if(us){
    var urows=XLSX.utils.sheet_to_json(us,{header:1,raw:true});
    var acc={m:{},l:{},xl:{}};
    urows.forEach(function(row){
      var name=String((row&&row[0])||'');
      if(name.indexOf('No.')<0)return;
      var t=name.indexOf('乾燥機(中)')>=0?'m':name.indexOf('乾燥機(大)')>=0?'l':name.indexOf('洗濯乾燥機')>=0?'xl':null;
      if(!t)return;
      for(var k=0;k<12;k++){var c=3+3*k;var v=row[c];if(v!=null&&v!==''&&!isNaN(parseFloat(v))){(acc[t][FM[k]]=acc[t][FM[k]]||[]).push(parseFloat(v));}}
    });
    ['m','l','xl'].forEach(function(t){Object.keys(acc[t]).forEach(function(ml){var arr=acc[t][ml];var avg=arr.reduce(function(a,b){return a+b;},0)/arr.length;ensure(ml)['laundry_util_'+t]=Math.round(avg*1000)/10;});});
  }
  // 値がすべて0/空の月は取り込み対象外
  Object.keys(months).forEach(function(m){var o=months[m];var any=Object.keys(o).some(function(k){var v=o[k];return v!=null&&v!==0&&v!=='';});if(!any)delete months[m];});
  return{months:months,fy:fy};
}
async function handleLaundryXlsx(file){
  if(!file)return;
  if(!/\.xlsx$/i.test(file.name)){S.laundryMsg='⚠️ .xlsx ファイルを選んでください';render();return;}
  if(typeof XLSX==='undefined'){S.laundryMsg='⚠️ Excel読込ライブラリを読み込めませんでした（ネット接続をご確認ください）';render();return;}
  S.laundryMsg='取り込み中...';render();
  try{
    var buf=await file.arrayBuffer();
    var res=parseLaundryXlsx(buf);
    var months=res.months,fy=res.fy,keys=Object.keys(months);
    if(!keys.length){S.laundryMsg='⚠️ 「月次サマリー」「損益サマリー」のデータが見つかりませんでした';render();return;}
    if(fy&&fy!==S.fy){stashActive();activateYear(fy);}
    var saved=0;
    keys.forEach(function(m){
      var cur=Object.assign({},S.kpiData[m]||{});
      var o=months[m];Object.keys(o).forEach(function(k){if(o[k]!=null)cur[k]=o[k];});
      S.kpiData=Object.assign({},S.kpiData);S.kpiData[m]=cur;
      if(S.gasConnected){try{gasPost({action:'save_kpi',month:gkey(S.fy,m),data:cur});}catch(e){}}
      saved++;
    });
    stashActive();
    S.selMonth=keys[0];
    S.laundryMsg='✅ '+saved+'か月分を取り込みました（'+fyLabel(S.fy)+'）'+(S.gasConnected?' / クラウド同期済み':'');
    render();
  }catch(e){S.laundryMsg='⚠️ 取込に失敗しました: '+(e&&e.message?e.message:e);render();}
}

function parseKpiFromText(text){
  function num(pp){for(var i=0;i<pp.length;i++){var m=text.match(pp[i]);if(m){var v=parseInt((m[1]||'').replace(/,/g,''));if(!isNaN(v)&&v>0)return v;}}return null;}
  function flt(pp){for(var i=0;i<pp.length;i++){var m=text.match(pp[i]);if(m){var v=parseFloat(m[1]);if(!isNaN(v))return v;}}return null;}
  function str(pp){for(var i=0;i<pp.length;i++){var m=text.match(pp[i]);if(m)return(m[1]||'').trim().slice(0,100);}return null;}
  return{
    aqxia_sales:num([/アクシア[^\d（【]*(\d[\d,]+)円/,/AQXIA[^\d]*(\d[\d,]+)円/i]),
    air_sales:num([/AIR[^\d（【]*(\d[\d,]+)円/i]),
    total_sales:num([/月間総売上[：:\s]*(\d[\d,]+)円/,/総売上[：:\s]*(\d[\d,]+)円/]),
    aqxia_arpu:num([/アクシア.*?ARPU[^\d]*(\d[\d,]+)/,/アクシア.*?([78],?\d{3})円/]),
    air_arpu:num([/AIR.*?ARPU[^\d]*(\d[\d,]+)/i,/AIR.*?([89],?\d{3})円/i]),
    total_transactions:num([/総売上件数[^\d]*(\d+)件/,/合計.*?(\d+)件/]),
    cashless_ratio:flt([/キャッシュレス[^\d]*(\d+\.?\d*)%/]),
    members_start:num([/月初会員数[^\d]*(\d+)名/,/月初[^\d]+(\d+)名/]),
    members_end:num([/月末[^\d]{0,20}(\d+)名/,/最終会員数[^\d]*(\d+)名/]),
    new_members:num([/入会者[^\d（]*(\d+)名/,/＋(\d+)名/]),
    left_members:num([/退会者[^\d]*(\d+)名/,/－(\d+)名/]),
    churn_rate:null,
    age_50s_pct:flt([/50代[（(](\d+\.?\d*)%/,/50代.*?(\d+\.?\d*)%/]),
    age_60s_pct:flt([/60代[（(](\d+\.?\d*)%/,/60代.*?(\d+\.?\d*)%/]),
    female_pct:flt([/女性\s*(\d+\.?\d*)%/]),
    peak_hour:str([/最大ピーク[^\d]*(\d+)時/,/ピーク[：:\s時帯]*(\d+)時/]),
    low_hour:str([/課題.*?(\d+)時/,/谷間.*?(\d+)時/]),
    low_slots:num([/低稼働枠[^\d計]*(\d+)枠/,/計(\d+)枠/]),
    personal_sales:num([/パーソナル.*合計[^\d]*(\d[\d,]+)円/]),
    personal_sessions:num([/合計\s*(\d+)セッション/,/(\d+)セッション.*合計/]),
    cash_balance:null,
    highlights:str([/【ハイライト[】】]([\s\S]{10,150})(?:【|ローライト|$)/]),
    lowlights:str([/【ローライト[】】]([\s\S]{10,150})(?:【|収益|要因|$)/]),
  };
}

async function extractPdfText(ab){
  var pdfjsLib=window['pdfjs-dist/build/pdf'];
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  var pdf=await pdfjsLib.getDocument({data:new Uint8Array(ab)}).promise;
  var texts=[];
  for(var i=1;i<=pdf.numPages;i++){
    var page=await pdf.getPage(i);
    var content=await page.getTextContent();
    texts.push(content.items.map(function(item){return item.str;}).join(' '));
  }
  return texts.join('\n').replace(/[ \t]+/g,' ').slice(0,6000);
}

async function handleKpi(file){
  if(!file)return;
  S.kpiLoading=true;S.kpiMsg='📄 読み込み中...';render();
  try{
    var text='';
    if(file.name.endsWith('.pdf')){var ab=await file.arrayBuffer();text=await extractPdfText(ab);}
    else if(file.name.endsWith('.docx')||file.name.endsWith('.doc')){var ab=await file.arrayBuffer();text=await extractDocxText(ab);}
    else{text=await file.text();}
    if(!text||text.length<30)throw new Error('テキストが読み取れませんでした（'+text.length+'文字）');
    var kpi=null;
    if(S.gasConnected&&S.gasUrl&&S.adminKey){
      S.kpiMsg='🤖 AI解析中（GAS経由）...';render();

  var _aqxiaLines=KPI_FIELDS.filter(function(f){return _gymCats[f[3]]&&kpi[f[0]]!=null&&kpi[f[0]]!=='';}).map(function(f){return f[1]+': '+fmtKpi(kpi[f[0]],f[2]);}).join(' / ');
  // コインランドリー実績を自動でまとめる
  var _lndDefs=[['laundry_sales','売上合計','man'],['laundry_dryer_m','乾燥機M売上','man'],['laundry_dryer_l','乾燥機L売上','man'],['laundry_washer','洗濯乾燥機XL売上','man'],['laundry_changer','両替機(抜取)','man'],['laundry_util','全体稼働率','pct'],['laundry_util_m','稼働率M','pct'],['laundry_util_l','稼働率L','pct'],['laundry_util_xl','稼働率XL','pct'],['laundry_labor','人件費','yen'],['laundry_op','営業利益','man']];
  var _lndLines=_lndDefs.filter(function(f){return kpi[f[0]]!=null&&kpi[f[0]]!=='';}).map(function(f){return f[1]+': '+fmtKpi(kpi[f[0]],f[2]);}).join(' / ');

  var prompt='あなたは経営コンサルタントです。以下のデータをもとに、スタッフ全員が読みやすい月次経営報告書を日本語マークダウンで作成してください。'+nl+nl
    +'対象月: '+m+nl
    +'売上高: '+fmtY(_effRev)+nl
    +'販管費: '+fmtY(_effSg)+nl
    +'営業利益: '+fmtY(_effOp)+nl
    +'経常利益: '+fmtY(_effEco)+nl
    +'純利益: '+fmtY(_effNet)+nl
    +'■ AQXIA Sports Club KPI（経営者は直接管理しておらず、以下のKPI数値のみが根拠です）:'+nl
    +'  '+(_aqxiaLines||'KPIデータなし')+nl
    +'■ コインランドリー実績:'+nl
    +'  '+(_lndLines||'データなし')+nl
    +'ハイライト: '+(kpi.highlights||'なし')+nl
    +'ローライト: '+(kpi.lowlights||'なし')+nl
    +'各事業の進捗（プール工事・ランドリーのシステム導入・宿泊施設の工事 など）: '+(a.biz||'なし')+nl
    +'課題・リスク: '+(a.issues||'なし')+nl
    +'来月の大型支出: '+(a.finance2||'なし')+nl
    +'経営者コメント: '+(a.ceo||'なし')+nl
    +(a.free_note?'追加指示・備考: '+a.free_note+nl:'')+nl
    +'【出力ルール】'+nl
    +'- 各セクションは「# ① タイトル」形式で始める'+nl
    +'- 重要な数字・キーワードは **太字** にする'+nl
    +'- 箇条書きは「- 」を使う'+nl
    +'- アクションプランは「1. 」番号付きリストにする'+nl
    +'- 経営者コメントセクションは「> 」引用形式で書く'+nl
    +'- AQXIA Sports Clubのセクションは、上記KPI数値だけを根拠に客観的に記述すること。経営者の入力が無いため、施策やキャンペーン名を推測で断定しないこと。会員数・入退会・退会率・ARPU等の数値から状況を読み取って書く'+nl
    +'- キャンペーンや施策は経営者から提供されていないので、勝手にキャンペーン名を作らないこと。施策にふれる場合はKPIの数値変化から推測される範囲にとどめる'+nl
    +'- コインランドリーのセクションは、機種別の売上・稼働率と人件費・営業利益にふれること'+nl
    +'- 各事業の進捗セクションは、入力された進捗（プール工事・ランドリーのシステム導入・宿泊施設の工事など）を整理して記述すること。新規事業の話にはしないこと'+nl
    +'- 全体で1500〜2200文字程度'+nl+nl
    +'【構成】この順で作成:'+nl
    +'# ① 今月のサマリー'+nl
    +'# ② 売上・財務状況'+nl
    +'# ③ AQXIA Sports Club（KPIから読み取り）'+nl
    +'# ④ コインランドリー（売上・稼働率）'+nl
    +'# ⑤ 各事業の進捗（プール工事・ランドリーのシステム導入・宿泊施設の工事 など）'+nl
    +'# ⑥ 課題とリスク'+nl
    +'# ⑦ 来月のアクションプラン'+nl
    +'# ⑧ 経営者コメント';

  try{
    // GAS経由でのみ生成（ブラウザからの直接API呼び出しはCORSで不可）
    if(!S.gasConnected||!S.gasUrl||!S.adminKey){
      throw new Error('Google Sheets（GAS）に接続してください。\n⚙️ DB設定 → Google Sheets同期 でURLと管理者キーを設定して「接続 & テスト」を押してください。');
    }
    var res=await fetch(S.gasUrl,{method:'POST',body:JSON.stringify({adminKey:S.adminKey,action:'generate_report',prompt:prompt})});
    var rawText=await res.text();
    var j;
    try{j=JSON.parse(rawText);}catch(pe){throw new Error('GAS応答の解析失敗: '+rawText.substring(0,200));}
    if(j&&j.ok&&j.text){
      S.genResult=j.text;
    }else{
      throw new Error(j&&j.error?j.error:'GAS応答異常: '+rawText.substring(0,100));
    }
  }catch(e){
    S.genResult='## ⚠️ 生成エラー\n\n'+e.message;
  }
  S.genLoading=false;render();
}


async function gasPost(body){
  if(!S.gasUrl||!S.adminKey)return;
  try{await fetch(S.gasUrl,{method:'POST',body:JSON.stringify(Object.assign({adminKey:S.adminKey},body))});}catch(e){}
}
async function loadGas(){
  if(!S.gasUrl)return;
  S.dbLoading=true;S.gasStatus='同期中...';render();
  try{
    var r=await fetch(S.gasUrl+'?type=all'),j=await r.json();
    if(j&&j.ok){
      S.years={};
      distribute(j.reports,'reports');
      distribute(j.kpi,'kpiData');
      distribute(j.financeNotes,'finNotes');
      distribute(j.formAnswers,'formAnswers');
      if(j.csvData&&j.csvData.rawData){var pc=parseName(j.csvData.csvName);var bc=ensureYear(pc.fy||BASE_FY);bc.csv=j.csvData.rawData;bc.csvName=pc.name||'（クラウドから）';bc.raw=parsePL(bc.csv).raw;}
      if(j.bsData&&j.bsData.rawData){var pb=parseName(j.bsData.bsName);var bb=ensureYear(pb.fy||BASE_FY);bb.bsData=parseBsCSV(j.bsData.rawData);bb.bsName=pb.name||'（クラウドから）';}
      if(j.bizCsvData&&j.bizCsvData.rawData){var pz=parseName(j.bizCsvData.bizCsvName);var bz=ensureYear(pz.fy||BASE_FY);bz.bizCsv=parseBizCSV(j.bizCsvData.rawData);bz.bizCsvName=pz.name||'（クラウドから）';}
      ensureYear(S.fy);activateYear(S.fy);
      S.gasStatus='✅ 同期完了 ('+new Date().toLocaleTimeString('ja-JP')+')';
    }else{S.gasStatus='⚠️ '+(j&&j.error||'エラー');}
  }catch(e){S.gasStatus='⚠️ '+e.message;}
  S.dbLoading=false;render();
}
async function connectGas(){
  var url=(document.getElementById('gas-url')||{}).value||'';
  var key=(document.getElementById('gas-key')||{}).value||'';
  if(!url||!key)return;
  S.gasTesting=true;S.gasStatus='接続テスト中...';render();
  try{
    var r=await fetch(url+'?type=all'),j=await r.json();
    if(j&&j.ok!==undefined){S.gasConnected=true;S.gasStatus='✅ 接続成功！';S.showSettings=false;S.gasTesting=false;render();setTimeout(loadGas,300);}
    else{S.gasStatus='⚠️ レスポンス不正';S.gasTesting=false;render();}
  }catch(e){S.gasStatus='⚠️ '+e.message;S.gasTesting=false;render();}
}

render();
if(S.gasConnected)loadGas();
</script>
